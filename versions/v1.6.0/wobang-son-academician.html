  if (log && ctx.student) void log;
}

function pickStudent(state, pick, rng) {
  const pool = activeStudents(state);
  if (pool.length === 0) return null;
  switch (pick) {
    case 'lowestHappy': return pool.reduce((a, b) => (a.happiness <= b.happiness ? a : b));
    case 'randomHappyHigh': {
      const high = pool.filter((s) => s.happiness >= 50);
      return rng.pick(high.length ? high : pool);
    }
    case 'randomHappyLow': {
      const low = pool.filter((s) => s.happiness < 60);
      return rng.pick(low.length ? low : pool);
    }
    case 'examSource': {
      const exam = pool.filter((s) => s.source === 'exam');
      return rng.pick(exam.length ? exam : pool);
    }
    case 'hasGrudge': {
      const g = pool.filter((s) => s.grudgeMonths > 0);
      return rng.pick(g.length ? g : pool);
    }
    case 'poachable': {
      const rich = pool.filter((s) => s.ability >= POACHABLE_ABILITY_MIN && s.happiness < POACHABLE_HAPPY_MAX);
      return rng.pick(rich.length ? rich : pool);
    }
    default: return rng.pick(pool);
  }
}

function pickProject(state, pick, rng) {
  const pool = activeProjects(state);
  if (pool.length === 0) return null;
  if (pick === 'enterprise') {
    const ent = pool.filter((p) => p.category === 'enterprise');
    return rng.pick(ent.length ? ent : pool);
  }
  return rng.pick(pool);
}

function resolveStudentTargets(state, target, ctx) {
  if (target === 'ctx') return ctx.student ? [ctx.student] : [];
  if (target === 'ctxStudents') return ctx.project ? ctx.project.assignedStudentIds.map((id) => state.students.find((s) => s.id === id)).filter(Boolean) : [];
  if (target === 'all') return activeStudents(state);
  return [];
}

/** 模板升/降一档：顺序取自 data 层（PAPER_PATTERN_ORDER，按 expectedIF 降序）。 */
function downgradePaperPattern(patternId) {
  const order = PAPER_PATTERN_ORDER;
  const idx = order.indexOf(patternId);
  return order[Math.min(order.length - 1, idx + 1)] || patternId;
}

function upgradePaperPattern(patternId) {
  const order = [...PAPER_PATTERN_ORDER].reverse();
  const idx = order.indexOf(patternId);
  return order[Math.min(order.length - 1, idx + 1)] || patternId;
}

/* ── 头衔与结局 ── */
function checkElectionWindow(state, log) {
  const monthIndex = state.calendar.monthIndex;
  const open = monthIndex > 0 && monthIndex % ELECTION_WINDOW_INTERVAL === 0;
  state.flags.electionWindowOpen = open;
  if (open) {
    state.flags.lastElectionMonthIndex = monthIndex;
    log('system', '增选窗口打开了：每两年一次，推荐票和材料要在这个时候递上去。', 'system');
    // t30（BALANCE §18.6）：已经在 rank7 候选席上、但票不够选不上的，记一次「错过窗口」，
    // 推荐票门槛随之上调（3 + 2×错过数，上限 9）——票因此变成实质机制，而不是叙事装饰。
    if (state.player.rankIndex === RANKS.length - 2) {
      const need = ticketRequirement(state);
      if (state.player.tickets < need) {
        state.player.missedElectionWindows = Math.max(0, Math.floor(Number(state.player.missedElectionWindows) || 0)) + 1;
        log('system', '这一轮增选票不够（' + state.player.tickets + '/' + need + '）。同行说：下一次得再攒两份推荐。', 'warn');
      }
    }
  }
  // GDD §10「准院士」：达到 rank 7 之后触发退休，或票数够了却错过最后一个增选窗口。
  // 修复：旧实现写成「窗口一关就置 almost」，导致 rank7+3 票的玩家在第一个窗口关闭后
  // 立刻被强制结束（最早第 25 月），与 GDD 不符，也让「刷到院士」变得不可能。
  // 现在只在「最后一个增选窗口」（= 退休月的那个窗口，之后不再有窗口）才判 almost。
  const lastWindow = Math.floor(RETIRE_MONTH / ELECTION_WINDOW_INTERVAL) * ELECTION_WINDOW_INTERVAL;
  const missedLastWindow = monthIndex >= lastWindow && state.player.rankIndex === RANKS.length - 2;
  const retiredAtRank7 = monthIndex >= RETIRE_MONTH && state.player.rankIndex === RANKS.length - 2;
  if (missedLastWindow || retiredAtRank7) state.flags.almostAcademician = true;
}

function checkPromotion(state, log) {
  const status = promotionStatus(state);
  if (!status.next) return;
  if (!status.eligible) return;
  state.player.rankIndex = status.next.index;
  addIntegrity(state, INTEGRITY_DELTA.promote);
  log('rank', '晋升：' + status.rank.title + ' → ' + status.next.title + '。', 'good');
  if (status.next.index >= RANKS.length - 1) {
    state.ending = { id: 'academician', title: '院士', monthIndex: state.calendar.monthIndex, text: '' };
    state.phase = 'ended';
  }
}

function checkEnding(state, log) {
  if (state.ending) return;
  if (state.player.money < 0) {
    state.flags.negativeMoneyMonths = (state.flags.negativeMoneyMonths || 0) + 1;
  } else {
    state.flags.negativeMoneyMonths = 0;
  }
  state.flags.bankrupt = isBankrupt(state) && state.player.consumable <= 0;
  state.flags.labEmptyThisMonth = isLabEmpty(state);
  if (state.calendar.monthIndex >= RETIRE_MONTH) state.flags.retired = true;
  const found = endingFor(state);
  if (found) {
    state.ending = {
      id: found.ending.id,
      title: found.variant ? found.variant.id + ' · ' + found.ending.title : found.ending.title,
      text: found.variant ? found.variant.text : found.ending.text,
      monthIndex: state.calendar.monthIndex,
      variant: found.variant ? found.variant.id : 'default',
    };
    state.phase = 'ended';
    log('ending', '结局：' + state.ending.title, found.ending.kind === 'bad' ? 'bad' : 'good');
  }
}

/**
 * 改名字（t5 验收：总览面板姓名可改）。
 * payload: { name?: string, sonName?: string }
 * 规则：trim + 压缩空格 + 截断到 PLAYER_NAME_MAX_LENGTH；空值给 toast 不改 state；
 *       改成功写一条 kind=system 的纪事，便于无头模拟/存档回看。
 */
function reduceSetName(state, payload) {
  const clean = (v) => String(v === undefined || v === null ? '' : v).replace(/\s+/g, ' ').trim().slice(0, PLAYER_NAME_MAX_LENGTH);
  const next = cloneState(state);
  const nextName = payload.name === undefined ? next.player.name : clean(payload.name);
  const nextSon = payload.sonName === undefined ? next.player.sonName : clean(payload.sonName);
  const changed = [];
  if (payload.name !== undefined) {
    if (!nextName) { next.ui.toast = '名字不能是空的。'; return next; }
    if (nextName !== next.player.name) {
      changed.push('你自己改名叫「' + nextName + '」（原名 ' + next.player.name + '）');
      next.player.name = nextName;
    }
  }
  if (payload.sonName !== undefined) {
    if (!nextSon) { next.ui.toast = '你儿子的名字不能是空的。'; return next; }
    if (nextSon !== next.player.sonName) {
      changed.push('你儿子改名叫「' + nextSon + '」（原名 ' + next.player.sonName + '）');
      next.player.sonName = nextSon;
    }
  }
  if (changed.length === 0) { next.ui.toast = '名字没变。'; return next; }
  pushChronicle(next, { kind: 'system', tone: 'system', text: '课题组更名：' + changed.join('；') + '。' });
  return next;
}

function reduceResign(state) {
  if (state.ending) return state;
  const next = cloneState(state);
  next.flags.resigned = true;
  const found = endingFor(next);
  next.ending = { id: 'industry', title: '下海', text: found ? (found.variant ? found.variant.text : found.ending.text) : '', monthIndex: next.calendar.monthIndex };
  next.phase = 'ended';
  pushChronicle(next, { kind: 'ending', tone: 'system', text: '你交了辞职报告，去企业做技术副总。' });
  return next;
}

/* ── 工具 ── */
function addIntegrity(state, delta) {
  state.player.integrity = Math.round(clamp(state.player.integrity + Number(delta || 0), INTEGRITY_MIN, INTEGRITY_MAX));
  return state.player.integrity;
}

function pushChronicle(state, entry) {
  const record = createChronicleEntry({
    id: 'c' + state.counters.nextChronicleId,
    monthIndex: state.calendar.monthIndex,
    year: state.calendar.year,
    month: state.calendar.month,
    kind: entry.kind || 'note',
    tone: entry.tone || 'system',
    text: entry.text || '',
  });
  state.counters.nextChronicleId += 1;
  state.chronicle.push(record);
  if (state.chronicle.length > 500) state.chronicle.splice(0, state.chronicle.length - 500);
  return record;
}

function recordHistory(state) {
  const students = activeStudents(state);
  const record = {
    monthIndex: state.calendar.monthIndex,
    year: state.calendar.year,
    month: state.calendar.month,
    money: state.player.money,
    consumable: state.player.consumable,
    totalIF: state.player.totalIF,
    rankIndex: state.player.rankIndex,
    health: state.player.health,
    integrity: state.player.integrity,
    students: students.length,
    activeProjects: activeProjects(state).length,
    avgHappiness: students.length ? round(students.reduce((s, st) => s + st.happiness, 0) / students.length, 1) : 0,
    avgDegree: students.length ? round(students.reduce((s, st) => s + st.degreeProgress, 0) / students.length, 1) : 0,
    tickets: state.player.tickets,
    papers: { ...state.player.papers },
  };
  state.stats.history.push(record);
  if (state.stats.history.length > 600) state.stats.history.shift();
  state.stats.peak.totalIF = Math.max(state.stats.peak.totalIF, record.totalIF);
  state.stats.peak.money = Math.max(state.stats.peak.money, record.money);
  state.stats.peak.students = Math.max(state.stats.peak.students, record.students);
  return record;
}

function reduceUi(state, patch) {
  const next = cloneState(state);
  if (patch.tab !== undefined && patch.tab) next.ui.tab = patch.tab;
  if (patch.modal !== undefined) next.ui.modal = patch.modal;
  if (patch.toast !== undefined) next.ui.toast = patch.toast;
  if (patch.studentId !== undefined) next.ui.selectedStudentId = patch.studentId;
  if (patch.projectId !== undefined) next.ui.selectedProjectId = patch.projectId;
  return next;
}

/** 供无头模拟与调试使用：一局从零开始、自动跑 N 个月。 */
function createGame(opts = {}) {
  return createState(opts);
}

/* ── src/core/save.js ── */
/**
 * save.js —— localStorage 存档：序列化 / 反序列化 / 版本迁移
 *
 * 冻结约定（docs/CONTRACT.md §5）：
 *   · 存档 key = SAVE_SLOT_KEY（wobang_son_academician_save）。
 *   · 存档内容是 { version, savedAt, state }；version 必须等于 STATE_VERSION。
 *   · 读档必须「宽容」：任何缺字段用默认值补齐、非法值丢弃、越界值夹紧，绝不抛异常。
 *   · 迁移策略：STATE_VERSION 每次 +1 时，在 MIGRATIONS 里加一个 vN→vN+1 的函数；
 *     迁移失败一律回退为「新局」，并向玩家提示存档已损坏。
 */










/** @typedef {{version:number, savedAt:number, state:any}} SaveEnvelope */

const SAVE_VERSION = STATE_VERSION;

/** v1.4.0：稀有人才名字白名单（读档只认这 8 个名字，别的字符串一律丢弃）。 */
const RARE_NAME_SET = new Set(RARE_TALENTS.map((t) => t.name));

/** t16 F8：契约 §3.5 声称 save.js 也导出 STATE_VERSION，这里显式再导出（读档方要拿它比版本）。 */


/** 版本迁移表：key = 源版本，值 = (state) => state。 */
const MIGRATIONS = {
  /**
   * v1 → v2（t24 一作归属模型）：v1 的 player.papers 统计的是「课题组全部产出」，
   * v2 起它只统计「玩家是一作」的论文。旧档无法逐篇反推当年的署名，
   * 但两处真实台账可以重算，且重算结果与 v1 的实际行为完全一致：
   *   · v1 里亲带项目并不给老板一作（署名按学生轮流），所以台账里
   *     firstAuthorId === PLAYER_AUTHOR_ID 的篇数为 0（将来再读旧档同样按此规则）；
   *   · 老板真正拿到的一作只有「买一作 / 抢一作」，每篇在 papersFirst 里恰好记一次。
   * totalIF 不动：它从来就是「所有论文」的口径，与本迁移无关。
   */
  1: (state) => {
    const next = { ...state, player: { ...((state && state.player) || {}) } };
    const counts = {};
    for (const tier of PAPER_TIER_ORDER) counts[tier] = 0;
    for (const project of Array.isArray(next.projects) ? next.projects : []) {
      for (const paper of Array.isArray(project && project.paperTiers) ? project.paperTiers : []) {
        if (paper && typeof paper === 'object' && paper.firstAuthorId === PLAYER_AUTHOR_ID
          && PAPER_TIER_ORDER.includes(paper.tier)) counts[paper.tier] += 1;
      }
    }
    const first = (next.player && next.player.papersFirst) || {};
    for (const tier of PAPER_TIER_ORDER) counts[tier] += Math.max(0, Math.floor(Number(first[tier]) || 0));
    next.player.papers = counts;
    return next;
  },
  /**
   * v2 → v3（1.1 实验室空间，LAB-SPACE §9）：把 1.0 的按种类计数用 First-Fit Decreasing
   * 自动摆进 A301（先放开局同款 2 张标准台），不够就**免费**补台/开房间——老玩家资产不缩水。
   * 摆放后重算 equipment 必须与迁移前逐项相等，否则返回 null（走「读档失败」路径）。
   */
  2: (state) => {
    const lab = (state && state.lab) || {};
    const before = {};
    for (const id of INSTRUMENT_IDS) before[id] = Math.max(0, Math.floor(Number(lab.equipment && lab.equipment[id]) || 0));
    const layout = layoutFromCounts(before, { startBenches: START_BENCHES });
    if (!layout) return null;
    const after = countEquipment(layout);
    for (const id of INSTRUMENT_IDS) if (after[id] !== before[id]) return null;
    return { ...state, lab: { ...lab, rooms: layout.rooms, nextUid: layout.nextUid, equipment: after } };
  },
};

/** 包装成存档信封。 */
function serialize(state) {
  return {
    version: STATE_VERSION,
    savedAt: Date.now(),
    state: JSON.parse(JSON.stringify(state)),
  };
}

/**
 * 把任意输入还原成合法 state；失败返回 null（调用方决定是否开新局）。
 * @param {any} raw 存档信封或裸 state
 */
function hydrate(raw) {
  try {
    if (!raw || typeof raw !== 'object') return null;
    const envelope = raw.state ? raw : { version: raw.version, state: raw };
    if (!envelope.state || typeof envelope.state !== 'object') return null;
    let migrated = envelope.state;
    let version = Math.floor(Number(envelope.version) || STATE_VERSION);
    while (version < STATE_VERSION) {
      const step = MIGRATIONS[version];
      if (typeof step !== 'function') return null;
      migrated = step(migrated);
      if (!migrated) return null;
      version += 1;
    }
    if (version > STATE_VERSION) return null;
    return validateState(migrated);
  } catch (err) {
    console.warn('[save] 读档失败：', err);
    return null;
  }
}

/** 白名单 + 逐字段校验：以一个全新 state 为骨架，把存档里的合法字段合并进来。 */
function validateState(rawState) {
  const seed = typeof rawState.seed === 'string' || typeof rawState.seed === 'number' ? rawState.seed : Date.now();
  const base = createState({ seed, playerName: rawState.player && rawState.player.name, sonName: rawState.player && rawState.player.sonName });

  const num = (v, fallback, lo, hi) => {
    const n = Number(v);
    if (!Number.isFinite(n)) return fallback;
    return clamp(n, lo === undefined ? -Infinity : lo, hi === undefined ? Infinity : hi);
  };

  // 日历
  const cal = rawState.calendar || {};
  base.calendar.monthIndex = Math.round(num(cal.monthIndex, 0, 0, 1e6));
  base.calendar.year = Math.max(1, Math.round(num(cal.year, 1, 1, 1e5)));
  base.calendar.month = Math.round(num(cal.month, 1, 1, 12));
  base.phase = ['action', 'settle', 'ended'].includes(rawState.phase) ? rawState.phase : 'action';
  base.seed = String(seed);
  base.rng = rawState.rng && Number.isFinite(rawState.rng.seed) ? { seed: rawState.rng.seed >>> 0 } : base.rng;

  // 玩家
  const p = rawState.player || {};
  Object.assign(base.player, {
    name: typeof p.name === 'string' && p.name ? p.name : base.player.name,
    sonName: typeof p.sonName === 'string' && p.sonName ? p.sonName : base.player.sonName,
    age: Math.round(num(p.age, base.player.age, 20, 90)),
    health: Math.round(num(p.health, base.player.health, 0, 100)),
    energy: Math.round(num(p.energy, base.player.energy, 0, 30)),
    // t16 F1：原来的 ±10 太窄（事件加成是累计的，读档会静默截断玩家的既有加成）；
    // 放宽到 ±50，仍然是一个「不可能被刷到」的物理上限。
    energyMaxDelta: Math.round(num(p.energyMaxDelta, 0, -50, 50)),
    rankIndex: Math.round(num(p.rankIndex, 1, 1, 8)),
    totalIF: round(num(p.totalIF, base.player.totalIF, 0, 1e6), 1),
    integrity: Math.round(num(p.integrity, base.player.integrity, 0, 100)),
    money: round(num(p.money, base.player.money, -1e5, 1e6), 2),
    consumable: round(num(p.consumable, base.player.consumable, 0, 1e5), 2),
    consumeMode: ['free', 'normal', 'tight'].includes(p.consumeMode) ? p.consumeMode : 'normal',
    tickets: Math.round(num(p.tickets, 0, 0, 99)),
    // t30：票门槛的「错过窗口」计数与一作空窗时间戳（都是玩家状态，必须随存档走）
    missedElectionWindows: Math.round(num(p.missedElectionWindows, 0, 0, 99)),
    lastFirstAuthorMonthIndex: Math.round(num(p.lastFirstAuthorMonthIndex, -1, -1, 1e6)),
    monthEnergySpent: Math.round(num(p.monthEnergySpent, 0, 0, 999)),
    monthMoneySpent: round(num(p.monthMoneySpent, 0, 0, 1e6), 2),
  });
  // 月度行动计数（talk/meeting/exercise/teambuild 的次数上限要按月重置，
  // 读档后如果丢掉，同一个月就能把限次行动刷第二次 —— t16 F1/F3）。
  for (const id of Object.keys(base.player.monthActions)) {
    base.player.monthActions[id] = Math.round(num(p.monthActions && p.monthActions[id], 0, 0, 999));
  }
  base.player.papers = mergePapers(base.player.papers, p.papers);
  base.player.papersFirst = mergePapers(base.player.papersFirst, p.papersFirst);
  base.player.graduated = {
    master: Math.round(num(p.graduated && p.graduated.master, 0, 0, 999)),
    phd: Math.round(num(p.graduated && p.graduated.phd, 0, 0, 999)),
  };

  // 实验室
  const lab = rawState.lab || {};
  // 1.1：空间结构逐项校验（越界/重叠/未知类型丢弃）；equipment 一律由摆放重算，不信任存档里的计数。
  const rooms = sanitizeRooms(lab.rooms);
  if (rooms) {
    base.lab.rooms = rooms.rooms;
    base.lab.nextUid = Math.max(rooms.nextUid, Math.round(num(lab.nextUid, 1, 1, 1e6)));
  } else if (lab.equipment && typeof lab.equipment === 'object') {
    const layout = layoutFromCounts(lab.equipment, { startBenches: START_BENCHES });
    if (layout) { base.lab.rooms = layout.rooms; base.lab.nextUid = layout.nextUid; }
  }
  base.lab.equipment = countEquipment(base.lab);
  // 1.3：仓库（lab.storage）。旧档没有该字段 → 安全默认成 []（不因此让读档失败）；
  // 逐项校验：未知仪器 id / 非法 uid / 与台面重复的 uid 一律丢弃（重复 uid 会让 store/deploy 指错台）。
  // 往返必须保留仓库内容，因此这里不能图省事清空。
  const usedUids = new Set();
  for (const { bench } of allBenches(base.lab)) {
    usedUids.add(bench.uid);
    for (const it of bench.items || []) usedUids.add(it.uid);
  }
  base.lab.storage = sanitizeStorage(lab.storage, usedUids);
  // uid 流水号要覆盖仓库里的条目，否则以后新买的台/仪器会和仓库里的 uid 撞号。
  for (const s of base.lab.storage) base.lab.nextUid = Math.max(base.lab.nextUid, uidNumber(s.uid));
  // t3（t4 暴露的 1.0 潜伏 bug）：下月耗材倍率是事件写进 lab 的，读档不恢复就会丢掉事件效果。
  base.lab.consumeMulThisMonth = round(num(lab.consumeMulThisMonth, CONSUME_MUL_DEFAULT, CONSUME_MUL_SAVE_MIN, CONSUME_MUL_SAVE_MAX), 3);
  for (const [id, months] of Object.entries(lab.equipmentDown || {})) {
    if (base.lab.equipmentDown[id] !== undefined) base.lab.equipmentDown[id] = Math.round(num(months, 0, 0, 36));
  }
  for (const [id, count] of Object.entries(lab.purchaseCount || {})) {
    if (base.lab.purchaseCount[id] !== undefined) base.lab.purchaseCount[id] = Math.round(num(count, 0, 0, 999));
  }

  // 学生 / 项目 / 市场
  if (Array.isArray(rawState.students)) {
    base.students = rawState.students
      .filter((s) => s && typeof s === 'object' && typeof s.id === 'string')
      .map((s) => createStudent(s));
  }
  if (Array.isArray(rawState.projects)) {
    base.projects = rawState.projects
      .filter((s) => s && typeof s === 'object' && typeof s.instanceId === 'string')
      .map((s) => createProject(s));
  }
  const mk = rawState.market || {};
  if (Array.isArray(mk.pool)) {
    base.market.pool = mk.pool.filter((o) => o && typeof o === 'object' && typeof o.offerId === 'string').map((o) => createOffer(o));
  }
  base.market.refreshedMonthIndex = Math.round(num(mk.refreshedMonthIndex, -1, -1, 1e6));
  base.market.lockedOfferId = typeof mk.lockedOfferId === 'string' ? mk.lockedOfferId : null;
  base.market.recruitedThisMonth = Math.round(num(mk.recruitedThisMonth, 0, 0, 99));
  // v1.4.0 稀有人才：旧档没有这个字段 → 默认空数组（宽容读档，绝不抛异常）；
  // 只保留名字白名单里的条目并去重，其余（含非法类型）一律丢弃。
  base.market.rareHired = Array.isArray(mk.rareHired)
    ? [...new Set(mk.rareHired.filter((n) => typeof n === 'string' && RARE_NAME_SET.has(n)))]
    : [];

  // 本月状态（t16 F1）：事件队列、已经结算过的事件、本月造假次数、月末标记。
  // 少了它们，读档会「把本月已经结算过的事件再触发一次」或者让审计计数回到 0。
  const mo = rawState.month || {};
  base.month.index = Math.round(num(mo.index, 0, 0, 1e6));
  base.month.fakesThisMonth = Math.round(num(mo.fakesThisMonth, 0, 0, 999));
  base.month.leavesThisMonth = Math.round(num(mo.leavesThisMonth, 0, 0, 999));
  if (Array.isArray(mo.eventQueue)) base.month.eventQueue = mo.eventQueue.filter((x) => typeof x === 'string').slice(0, 64);
  if (Array.isArray(mo.eventsResolved)) base.month.eventsResolved = mo.eventsResolved.filter((x) => typeof x === 'string').slice(0, 64);
  if (Array.isArray(mo.pendingQueue)) {
    base.month.pendingQueue = mo.pendingQueue
      .filter((q) => q && typeof q === 'object' && typeof q.eventId === 'string')
      .slice(0, 16)
      .map((q) => ({ eventId: q.eventId, monthIndex: Math.round(Number(q.monthIndex) || 0), choiceId: typeof q.choiceId === 'string' ? q.choiceId : null }));
  }
  if (mo.flags && typeof mo.flags === 'object') {
    for (const [k, v] of Object.entries(mo.flags)) {
      if (typeof v === 'boolean' || Number.isFinite(v)) base.month.flags[k] = v;
    }
  }

  // 计数器 / 事件冷却 / flags / 纪事
  for (const key of Object.keys(base.counters)) {
    base.counters[key] = Math.round(num(rawState.counters && rawState.counters[key], base.counters[key], 0, 1e6));
  }
  base.counters.nextStudentId = Math.max(base.counters.nextStudentId, nextIdHint(base.students, 's'));
  base.counters.nextProjectId = Math.max(base.counters.nextProjectId, nextIdHint(base.projects, 'p'));
  if (rawState.eventState && typeof rawState.eventState === 'object') {
    const cooldowns = rawState.eventState.lastFiredMonth || {};
    for (const [id, month] of Object.entries(cooldowns)) {
      if (Number.isFinite(month)) base.eventState.lastFiredMonth[id] = Math.round(month);
    }
  }
  for (const key of Object.keys(base.flags)) {
    const v = rawState.flags && rawState.flags[key];
    if (typeof base.flags[key] === 'boolean') base.flags[key] = Boolean(v);
    else if (typeof base.flags[key] === 'number') base.flags[key] = num(v, base.flags[key]);
  }
  // 白名单之外的数值型 flag 也保留：引擎新加的计数器型 flag（如 negativeMoneyMonths）
  // 一旦被白名单漏掉就会静默归零，等于给玩家一个存读档漏洞（t16 F1）。
  for (const [key, v] of Object.entries(rawState.flags && typeof rawState.flags === 'object' ? rawState.flags : {})) {
    if (key in base.flags) continue;
    if (Number.isFinite(v) && key.length <= 40) base.flags[key] = Math.round(num(v, 0, -1e6, 1e6));
  }
  if (Array.isArray(rawState.chronicle)) {
    base.chronicle = rawState.chronicle.slice(-400).map((c) => createChronicleEntry(c));
  }
  base.ending = rawState.ending && typeof rawState.ending.id === 'string' ? { ...rawState.ending } : null;
  base.pendingEvent = rawState.pendingEvent && typeof rawState.pendingEvent.eventId === 'string' ? { ...rawState.pendingEvent } : null;
  if (rawState.stats && Array.isArray(rawState.stats.history)) {
    base.stats.history = rawState.stats.history
      .filter((h) => h && Number.isFinite(h.monthIndex))
      .map((h) => ({ ...h }));
  }
  // 月度回执（只用于展示，脏数据一律夹掉，不参与任何游戏数值）
  if (rawState.stats && rawState.stats.peak && typeof rawState.stats.peak === 'object') {
    // t16 F1：曲线峰值（历史最高 IF / 经费 / 学生数）也要持久化，否则读档后 UI 的
    // 「历史最高」会掉回 0。
    const pk = rawState.stats.peak;
    base.stats.peak = {
      totalIF: round(num(pk.totalIF, 0, 0, 1e6), 1),
      money: round(num(pk.money, 0, -1e5, 1e6), 2),
      students: Math.round(num(pk.students, 0, 0, 999)),
    };
  }
  if (rawState.stats && rawState.stats.lastReceipt && typeof rawState.stats.lastReceipt === 'object') {
    base.stats.lastReceipt = sanitizeReceipt(rawState.stats.lastReceipt);
  }
  if (rawState.ui && typeof rawState.ui === 'object') {
    base.ui = { ...base.ui, ...pickUi(rawState.ui) };
  }
  return base;
}

/** uid 形如 'i12' / 'b3'：取数字部分，非法一律 0（与 core/lab.js 的 uidNum 同口径）。 */
function uidNumber(uid) {
  const n = Number(String(uid).slice(1));
  return Number.isFinite(n) ? n : 0;
}

/**
 * 1.3：仓库逐项校验（LAB-SPACE §11）。返回 [{ uid, inst }]；
 * raw 不是数组（含旧档的 undefined）→ []，绝不抛异常。
 * @param {any} raw 存档里的 lab.storage
 * @param {Set<string>} usedUids 台面已经占用的 uid，仓库不得重复
 */
function sanitizeStorage(raw, usedUids) {
  const seen = usedUids || new Set();
  const out = [];
  for (const s of Array.isArray(raw) ? raw : []) {
    if (!s || typeof s !== 'object' || typeof s.uid !== 'string' || seen.has(s.uid)) continue;
    if (!INSTRUMENT_MAP[s.inst]) continue;
    seen.add(s.uid);
    out.push({ uid: s.uid, inst: s.inst });
  }
  return out;
}

/** 月度回执的白名单校验：字段类型不对就丢，数组截断到合理长度。 */
function sanitizeReceipt(raw) {
  const num = (v) => (Number.isFinite(Number(v)) ? Number(v) : 0);
  const list = (v) => (Array.isArray(v) ? v.filter((x) => x && typeof x === 'object').slice(0, 64).map((x) => ({ ...x })) : []);
  return {
    monthIndex: num(raw.monthIndex), year: num(raw.year), month: num(raw.month),
    income: list(raw.income),
    expense: list(raw.expense),
    projects: list(raw.projects),
    students: list(raw.students),
    papers: list(raw.papers),
    papersAll: num(raw.papersAll),
    papersStudent: num(raw.papersStudent),
    events: Array.isArray(raw.events) ? raw.events.filter((e) => typeof e === 'string').slice(0, 8) : [],
    integrityDelta: num(raw.integrityDelta),
    ticketsDelta: num(raw.ticketsDelta),
    // t16 F1：回执里的「结算后状态」字段原先没进白名单，读档后 UI 的
    // 「上月结算后诚信 / 票数」会凭空少两项（tests/save.test.mjs 抓到字段数 24 → 22）。
    integrityAfter: num(raw.integrityAfter),
    ticketsAfter: num(raw.ticketsAfter),
    moneyBefore: num(raw.moneyBefore),
    moneyAfter: num(raw.moneyAfter),
    moneyNet: num(raw.moneyNet),
    consumableBefore: num(raw.consumableBefore),
    consumableAfter: num(raw.consumableAfter),
    consumableNet: num(raw.consumableNet),
    ifDelta: num(raw.ifDelta),
    starvedCount: num(raw.starvedCount),
    starvedProjects: Array.isArray(raw.starvedProjects) ? raw.starvedProjects.filter((x) => typeof x === 'string').slice(0, 16) : [],
    starvedHint: typeof raw.starvedHint === 'string' ? raw.starvedHint.slice(0, 200) : '',
    consumableLow: Boolean(raw.consumableLow),
  };
}

function pickUi(ui) {
  const out = {};
  if (['crew', 'projects', 'market', 'actions', 'chronicle'].includes(ui.tab)) out.tab = ui.tab;
  if (ui.modal === null || typeof ui.modal === 'string') out.modal = ui.modal;
  if (ui.toast === null || typeof ui.toast === 'string') out.toast = ui.toast;
  if (typeof ui.selectedStudentId === 'string' || ui.selectedStudentId === null) out.selectedStudentId = ui.selectedStudentId;
  if (typeof ui.selectedProjectId === 'string' || ui.selectedProjectId === null) out.selectedProjectId = ui.selectedProjectId;
  // t25：一键分配的「上次结果摘要」（纯展示用，逐字段白名单校验）
  if (ui.autoAssign && typeof ui.autoAssign === 'object') {
    const texts = (v) => (Array.isArray(v) ? v.filter((x) => typeof x === 'string').slice(0, 32) : []);
    const n = (v) => Math.round(Number(v) || 0);
    out.autoAssign = {
      monthIndex: n(ui.autoAssign.monthIndex),
      moveCount: n(ui.autoAssign.moveCount),
      studentsTouched: n(ui.autoAssign.studentsTouched),
      studentsTotal: n(ui.autoAssign.studentsTotal),
      projectsTotal: n(ui.autoAssign.projectsTotal),
      availableStudents: n(ui.autoAssign.availableStudents),
      studentCap: n(ui.autoAssign.studentCap),
      projectCap: n(ui.autoAssign.projectCap),
      studentsWithoutProject: texts(ui.autoAssign.studentsWithoutProject),
      studentsFull: texts(ui.autoAssign.studentsFull),
      projectsShort: Array.isArray(ui.autoAssign.projectsShort)
        ? ui.autoAssign.projectsShort.filter((p) => p && typeof p === 'object').slice(0, 32).map((p) => ({
          id: String(p.id || ''), name: String(p.name || ''), members: n(p.members), cap: n(p.cap),
        }))
        : [],
      feedback: typeof ui.autoAssign.feedback === 'string' ? ui.autoAssign.feedback.slice(0, 300) : '',
    };
  }
  return out;
}

function mergePapers(base, raw) {
  const out = { ...base };
  for (const key of Object.keys(base)) {
    const n = Number(raw && raw[key]);
    if (Number.isFinite(n) && n >= 0) out[key] = Math.round(n);
  }
  return out;
}

function nextIdHint(list, prefix) {
  let max = 1;
  for (const item of list || []) {
    const id = item.id || item.instanceId || '';
    const n = parseInt(String(id).replace(prefix, ''), 10);
    if (Number.isFinite(n) && n >= max) max = n + 1;
  }
  return max;
}

/* ── localStorage 读写（无 DOM 环境自动降级为内存存档） ── */
const memory = {};

function storageOf(storage) {
  if (storage) return storage;
  try {
    if (typeof localStorage !== 'undefined') return localStorage;
  } catch (err) {
    void err;
  }
  return null;
}

function saveGame(state, storage) {
  const store = storageOf(storage);
  const envelope = serialize(state);
  const text = JSON.stringify(envelope);
  try {
    if (store) store.setItem(SAVE_SLOT_KEY, text);
    else memory[SAVE_SLOT_KEY] = text;
  } catch (err) {
    console.warn('[save] 存档失败（可能是隐私模式或容量超限）：', err);
    return null;
  }
  state.meta = { savedAt: envelope.savedAt, autosave: Boolean(AUTOSAVE_ON_MONTH_END) };
  return envelope;
}

function loadGame(storage) {
  const store = storageOf(storage);
  let text = null;
  try {
    text = store ? store.getItem(SAVE_SLOT_KEY) : memory[SAVE_SLOT_KEY] || null;
  } catch (err) {
    void err;
    text = null;
  }
  if (!text) return null;
  try {
    return hydrate(JSON.parse(text));
  } catch (err) {
    console.warn('[save] 存档 JSON 解析失败：', err);
    return null;
  }
}

function hasSave(storage) {
  const store = storageOf(storage);
  try {
    return Boolean(store ? store.getItem(SAVE_SLOT_KEY) : memory[SAVE_SLOT_KEY]);
  } catch (err) {
    void err;
    return false;
  }
}

function clearSave(storage) {
  const store = storageOf(storage);
  try {
    if (store) store.removeItem(SAVE_SLOT_KEY);
    else delete memory[SAVE_SLOT_KEY];
  } catch (err) {
    void err;
  }
}

/**
 * 三种处理方式的推荐人选：先本项目在读学生，不够再从全组按能力补。
 * 纯排序查表、无随机 —— 成功率由 core 算好给 UI 显示，抽调的也是同一批人（所见即所得）。
 */
function suggestedMembers(state, project, limit) {
  const byAbility = (a, b) => (b.ability - a.ability) || (a.id < b.id ? -1 : 1);
  const onProject = (project.assignedStudentIds || [])
    .map((id) => state.students.find((s) => s.id === id))
    .filter((s) => s && !s.left && !s.graduated)
    .sort(byAbility);
  const taken = new Set(onProject.map((s) => s.id));
  const others = state.students
    .filter((s) => !s.left && !s.graduated && !taken.has(s.id))
    .sort(byAbility);
  return onProject.concat(others).slice(0, Math.max(0, limit));
}

function selectHardpoint(state, project, hp) {
  const statusLabels = { hidden: '未暴露', open: '未解决', solved: '已解决', faked: '已蒙混' };
  const row = {
    id: hp.id,
    hd: hp.hd,
    status: hp.status,
    statusLabel: statusLabels[hp.status] || hp.status,
    method: hp.method,
    appearText: hp.status === 'hidden' ? '第 ' + hp.appearAt + ' 月暴露' : '',
    open: hp.status === 'open' || hp.status === 'hidden',
  };
  if (hp.status !== 'open') return row;
  // t8 finding：每个按钮要显示成功率、列出会被抽调的学生姓名与幸福代价。
  // 概率依赖学生能力与重试加成，必须由 core 算（UI 不许出现公式）。
  const bonus = retryBonus(hp.retries || 0);
  const teamMembers = suggestedMembers(state, project, TEAM_MIN_STUDENTS);
  const soloMembers = suggestedMembers(state, project, 1);
  const teamChance = teamSuccessChance(teamMembers, bonus);
  const soloChance = soloMembers.length ? soloSuccessChance(soloMembers[0].ability, bonus) : 0;
  const catchChance = fakeCatchChance(hp.fakeCount || 0, state.counters.fakesTotal || 0);
  row.attempts = {
    retryBonus: bonus,
    team: {
      studentIds: teamMembers.map((s) => s.id),
      names: teamMembers.map((s) => s.name),
      enough: teamMembers.length >= TEAM_MIN_STUDENTS,
      chance: teamChance,
      pct: Math.round(teamChance * 100),
    },
    solo: {
      studentIds: soloMembers.map((s) => s.id),
      names: soloMembers.map((s) => s.name),
      chance: soloChance,
      pct: Math.round(soloChance * 100),
    },
    fake: { chance: catchChance, pct: Math.round(catchChance * 100) },
  };
  return row;
}

function selectEquipment(state) {
  return INSTRUMENTS.map((def) => {
    const owned = state.lab.equipment[def.id] || 0;
    const down = (state.lab.equipmentDown[def.id] || 0) > 0;
    const price = instrumentPrice(def.id);
    const reasons = [];
    if (state.player.rankIndex < def.tierGate) reasons.push('需头衔 ' + def.tierGate);
    if (state.player.money < price) reasons.push('经费不足');
    // 1.1：没有持有上限，唯一约束是空间（LAB-SPACE §2）
    const spot = findSpot(state.lab, def.id);
    if (!spot) reasons.push('空间不足');
    return {
      id: def.id,
      name: def.name,
      tier: def.tier,
      tierLabel: def.tierLabel,
      bonusPct: Math.round(def.bonus * 100),
      owned,
      holdCap: '∞',                       // 1.1：取消持有上限（展示用）
      w: def.w,
      h: def.h,
      cells: def.w * def.h,
      flavor: def.flavor || '',
      autoSpot: spot,                     // 自动摆放会落在哪（无坐标购买时）
      sellRefund: Math.round(price * SELL_REFUND_RATE * 100) / 100,
      down,
      downMonths: state.lab.equipmentDown[def.id] || 0,
      price,
      maintain: def.maintain,
      reason: reasons[0] || '',
      canBuy: reasons.length === 0,
    };
  });
}

/** 1.1 实验室空间：房间 → 台位 → 台子 → 仪器（LAB-SPACE §10 的 UI 数据源）。 */
function selectLabSpace(state) {
  const lab = state.lab;
  const money = state.player.money;
  const rank = state.player.rankIndex;
  const rooms = (lab.rooms || []).map((room, roomIdx) => {
    const def = ROOMS[roomIdx] || {};
    return {
      roomIdx, id: room.id, name: def.name || room.id, flavor: def.flavor || '', owned: true,
      cols: ROOM_SLOT_COLS,
      slots: room.slots.map((bench, slot) => {
        if (!bench) return { slot, empty: true };
        const size = BENCH_MAP[bench.type];
        return {
          slot, empty: false, uid: bench.uid, type: bench.type, name: size.name, w: size.w, h: size.h,
          sellRefund: Math.round(size.price * SELL_REFUND_RATE * 100) / 100,
          canSell: bench.items.length === 0,
          items: bench.items.map((it) => {
            const d = INSTRUMENT_MAP[it.inst];
            const fp = footprint(it.inst, it.rot);
            return {
              uid: it.uid, inst: it.inst, name: d.name, tier: d.tier, tierLabel: d.tierLabel, x: it.x, y: it.y, rot: it.rot,
              w: fp.w, h: fp.h, flavor: d.flavor || '', bonusPct: Math.round(d.bonus * 100), maintain: d.maintain,
              down: (lab.equipmentDown[it.inst] || 0) > 0,
              sellRefund: Math.round(instrumentPrice(it.inst) * SELL_REFUND_RATE * 100) / 100,
            };
          }),
        };
      }),
    };
  });
  const nextIdx = rooms.length;
  const nextRoomDef = nextIdx < ROOM_MAX ? ROOMS[nextIdx] : null;
  const nextRoom = nextRoomDef ? (() => {
    const reason = rank < nextRoomDef.rankGate ? '需「' + rankOf(nextRoomDef.rankGate).title + '」' : (money < nextRoomDef.price ? '经费不足' : '');
    return { roomIdx: nextIdx, id: nextRoomDef.id, name: nextRoomDef.name, price: nextRoomDef.price, rankGate: nextRoomDef.rankGate, rankGateTitle: rankOf(nextRoomDef.rankGate).title, flavor: nextRoomDef.flavor, canBuy: !reason, reason };
  })() : null;
  const freeSlot = findEmptySlot(lab);
  const benches = BENCHES.map((b) => {
    const reason = rank < b.rankGate ? '需「' + rankOf(b.rankGate).title + '」' : (!freeSlot ? '没有空台位' : (money < b.price ? '经费不足' : ''));
    return { id: b.id, name: b.name, w: b.w, h: b.h, cells: b.w * b.h, price: b.price, rankGate: b.rankGate, rankGateTitle: rankOf(b.rankGate).title, canBuy: !reason, reason };
  });
  return {
    rooms,
    lockedRooms: ROOMS.slice(nextIdx).map((d) => ({ id: d.id, name: d.name, price: d.price, rankGate: d.rankGate, rankGateTitle: rankOf(d.rankGate).title, flavor: d.flavor })),
    nextRoom,
    benches,
    summary: spaceSummary(lab),
    text: { ...LAB_TEXT },
  };
}

function selectLab(state) {

  // bonusRawPct 保留为同值，纯为兼容旧调用方。

function selectMarket(state) {
  // t22（T11-F1）：这里必须分清两件事，否则 UI 会把「招生季关闭」误读成「市场关闭」。
  //   · recruitOpen / openText —— 只描述**人才市场（招生季）**：每年 6–12 月；
  //   · projectsOpenAllYear —— 项目市场全年刷新（每月 REFRESH_MONTHLY 个，上限 PROJECT_SLOTS）。
  // 旧实现的 open 同时表示两者，于是 1–5 月的项目栏被 UI 写成「市场休市」。
  const recruitOpen = isMarketOpen(state);
  const open = recruitOpen;
  const offers = state.market.pool;
  const projectCount = offers.filter((o) => o.kind === 'project').length;
  const studentCount = offers.filter((o) => o.kind === 'student').length;
  const projects = offers.filter((o) => o.kind === 'project').map((o) => {
    const check = canAcceptOffer(state, o);
    return {
      offerId: o.offerId,
      kind: 'project',
      defId: o.defId,
      name: (PROJECT_MAP[o.defId] || {}).name || o.defId,
      category: o.category,
      categoryLabel: o.category === 'enterprise' ? '企业' : '国家',
      tier: o.tier,
      tierLabel: 'T' + o.tier,
      money: o.money,
      deposit: Math.round(o.money * ((PROJECT_MAP[o.defId] || {}).depositRate || DEPOSIT_RATE[o.category] || DEPOSIT_RATE.enterprise) * 10) / 10,
      limitMonths: o.limitMonths,
      workload: o.workload,
      requireText: Object.entries(o.require || {}).map(([id, n]) => (INSTRUMENT_MAP[id] ? INSTRUMENT_MAP[id].name : id) + '×' + n).join('、') || '无',
      locked: Boolean(o.locked),
      canAccept: check.ok,
      reason: check.reasons.length ? check.reasons[0].text : '',
    };
  });
  const students = offers.filter((o) => o.kind === 'student').map((o) => {
    const check = canRecruitOffer(state, o);
    return {
      offerId: o.offerId,
      kind: 'student',
      name: o.name,
      degree: o.degree,
      degreeLabel: DEGREE_LABELS[o.degree] || o.degree,
      source: o.source,
      sourceLabel: o.source === 'exam' ? '考研' : '保研',
      ability: o.ability,
      abilityPct: Math.round(o.ability * 100),
      rare: o.rare === true,
      cost: o.cost,
      reqIF: o.reqIF,
      reqRank: o.reqRank,
      expectedWage: (() => {
        const tier = expectedWageTier(o.ability);
        return { tier, label: WAGE_TIER_LABELS[tier] || tier };
      })(),
      canHire: check.ok,
      reason: check.reasons.length ? check.reasons[0].text : '',
    };
  });
  return {

/* ══ v1.5.0 游戏内百科（10 章） ══
   硬约束（_probe/wiki-1.5-spec.md ①）：百科里出现的每一个数字都在这里从 src/data 取，
   经 viewmodel 暴露给 UI；src/ui/views/wiki.js 只做排版，不出现任何游戏数值字面量。
   key 是对外契约：scripts/ui-smoke.mjs 用 [data-wiki-key] 逐项把页面数字与 core 常量对账。 */

const WIKI_NONE = '—';

/** 最多三位小数的紧凑写法（整数不带 .0；0.85 不会被抹成 0.9，0.004 也不会归零）。 */
function wikiTrim(n) {
  const v = Number(n);
  if (!Number.isFinite(v)) return WIKI_NONE;
  return String(Math.round(v * 1000) / 1000);
}

/** 金额统一两位小数：仪器维护费这类 0.08 万的小额不能被抹掉。 */
function wikiTrim2(n) {
  const v = Number(n);
  if (!Number.isFinite(v)) return WIKI_NONE;
  return String(Math.round(v * 100) / 100);
}

/** 带符号的差值文本：+3 / −8 / 0（负号用 U+2212，与 UI 既有排版一致）。 */
function wikiDeltaOf(n) {
  const v = Number(n);
  if (!Number.isFinite(v) || Math.round(v * 10) === 0) return '0';
  return (v > 0 ? '+' : '−') + wikiTrim(Math.abs(v));
}

function wikiMoneyOf(n) { return wikiTrim2(n) + ' 万'; }
/** 0.4 → 40% */
function wikiPctOf(x) { return Math.round(Number(x) * 100) + '%'; }
/** 0.85 → ×0.85 */
function wikiMulOf(x) { return '×' + wikiTrim(x); }

function wikiRowOf(key, label, value, note) {
  return {
    key,
    label,
    value: value === undefined || value === null ? WIKI_NONE : String(value),
    note: note ? String(note) : '',
  };
}

/** 头衔的项目门槛子句（第 8 级有两条：T6×1 且 T5+×2）。 */
function wikiProjTextOf(rank) {
  const parts = [];
  if (rank.projTierReq) parts.push('T' + rank.projTierReq + ' 结题 ×' + (rank.projCountReq || 1));
  if (rank.projTierReq2) parts.push('T' + rank.projTierReq2 + ' 及以上结题 ×' + rank.projCountReq2);
  return parts.length ? parts.join(' 且 ') : '无';
}

function selectActions(state) {
  const energy = energyMax(state);
  const pack = CONSUMABLE_BUY_PACK;
  const packCost = pack * CONSUMABLE_PRICE_PER_UNIT;
  return {
    energy: state.player.energy,
    energyMax: energy,
    money: state.player.money,
    consumable: state.player.consumable,
    consumableLow: state.player.consumable < CONSUMABLE_LOW_THRESHOLD,
    buyPack: pack,
    buyPackCost: packCost,
    canBuyConsumable: state.player.money >= packCost,
    consumeMode: state.player.consumeMode,
    consumeModes: CONSUME_MODE_ORDER.map((id) => ({
      id,
      label: CONSUME_MODES[id].label,
      hint: CONSUME_MODES[id].hint,
      active: state.player.consumeMode === id,
    })),
    studentOptions: selectActiveStudents(state).map((s) => ({ id: s.id, name: s.name + '（' + s.degreeLabel + '）' })),
    projectOptions: selectProjects(state).filter((p) => p.status === 'active').map((p) => ({ id: p.instanceId, name: p.name })),
    autoAssign: selectAutoAssign(state),
  };
}

/**
 * 一键分配工作（t25）：把引擎的分配计划原样透给 UI——可分配学生数、仍缺人的项目、
 * 上次分配结果摘要、以及「点下去会怎么分」的预览。UI 不需要自己推导任何规则。
 */
function selectAutoAssign(state) {
  const plan = autoAssignPlan(state);
  const last = state.ui && state.ui.autoAssign ? state.ui.autoAssign : null;
  return {
    canAssign: plan.moves.length > 0,
    planCount: plan.moves.length,
    plan: plan.moves.map((m) => ({ ...m })),
    feedback: plan.summary.feedback,
    availableStudents: plan.summary.availableStudents,
    studentsTotal: plan.summary.studentsTotal,
    projectsTotal: plan.summary.projectsTotal,
    studentsWithoutProject: plan.summary.studentsWithoutProject.slice(),
    studentsFull: plan.summary.studentsFull.slice(),
    projectsShort: plan.summary.projectsShort.map((p) => ({ ...p })),
    studentCap: plan.summary.studentCap,
    projectCap: plan.summary.projectCap,
    last: last ? JSON.parse(JSON.stringify(last)) : null,
  };
}

/** 上月结算回执（state.stats.lastReceipt）：UI 展示「收入/支出/进度/幸福度去哪了」。 */
function selectReceipt(state) {
  const r = state.stats && state.stats.lastReceipt;
  if (!r) return null;
  return JSON.parse(JSON.stringify(r));
}

function selectChronicle(state, limit = 60) {
  const list = state.chronicle.slice(-limit).map((c) => ({ ...c, text: c.text }));
  return list.reverse();
}

function selectPendingEvent(state) {
  if (!state.pendingEvent) return null;
  const ev = EVENT_MAP[state.pendingEvent.eventId];
  if (!ev) return null;
  const choices = Array.isArray(ev.choices) && ev.choices.length
    ? ev.choices.map((c) => ({ id: c.id, label: c.label, hint: c.hint || '' }))
    : [{ id: 'ack', label: '知道了', hint: '' }];
  return { eventId: ev.id, title: ev.title, text: ev.text, tone: ev.tone, choices };
}

function selectEnding(state) {
  if (!state.ending) return null;
  const def = ENDING_MAP[state.ending.id];
  return {
    id: state.ending.id,
    title: state.ending.title || (def ? def.title : state.ending.id),
    kind: def ? def.kind : 'neutral',
    text: state.ending.text || (def ? def.text : ''),
    monthIndex: state.ending.monthIndex,
  };
}

/** 一作空窗（t30）：距最近一次拿到本人一作的月数 + core 判定的 stuck（阈值在 data/tuning.js）。 */
function selectFirstAuthorDrought(state) {
  return firstAuthorDrought(state);
}

function selectElection(state) {
  return {
    windowOpen: Boolean(state.flags.electionWindowOpen),
    tickets: state.player.tickets,
  };
}

const TABS = [
  { id: 'lab', label: '课题组' },
  { id: 'projects', label: '项目' },
  { id: 'market', label: '市场' },
  { id: 'actions', label: '行动' },
  { id: 'chronicle', label: '纪事' },
];

function buildHud(state) {
  const time = selectTime(state);
  const rank = selectRankInfo(state);
  const ach = selectAchievements(state);
  const slots = selectSlots(state);
  return {
    time,
    rank,
    name: state.player.name,
    sonName: state.player.sonName,
    ageText: state.player.age + ' 岁',
    phase: selectPhase(state),
    money: state.player.money,
    consumable: state.player.consumable,
    consumableLow: selectActions(state).consumableLow,
    consumableHint: selectActions(state).consumableLow ? '耗材见底：去「行动」页采购，否则本月进度归零' : '',
    energy: state.player.energy,
    energyMax: selectActions(state).energyMax,
    health: state.player.health,
    integrity: state.player.integrity,
    achievements: ach,
    slots,
    tickets: state.player.tickets,
    // 延毕决定是「待决状态」：没拍板之前不能推进月份（t8 finding）
    canAdvance: state.phase === 'action' && !state.pendingEvent && !state.ending && selectPendingDefer(state).length === 0,
    election: selectElection(state),
    // t30（前端 t26/t36 的顶栏提示）：一作空窗——months 从第 0 月起算，stuck 由 core 判定。
    firstAuthorDrought: selectFirstAuthorDrought(state),
  };
}

/**
 * 生成整个界面的数据快照。
 * @param {any} state
 * @returns {{hud:any, tabs:any[], crew:any, projects:any, market:any, actions:any, chronicle:any[], pendingEvent:any, ending:any, toast:any}}
 */
function buildViewModel(state) {
  return {
    hud: buildHud(state),
    tabs: TABS.map((t) => ({ ...t, active: normalTab(state.ui.tab) === t.id })),
    tab: normalTab(state.ui.tab),
    crew: {
      students: selectStudents(state),
      active: selectStudents(state).filter((s) => s.statusLabel === '在读' || s.statusLabel === '延毕中'),
      lab: selectLab(state),
      slots: selectSlots(state),
      achievements: selectAchievements(state),
      rank: selectRankInfo(state),
    },
    projects: { list: selectProjects(state).filter((p) => p.status === 'active'), archive: selectProjects(state).filter((p) => p.status !== 'active') },
    market: selectMarket(state),
    actions: selectActions(state),
    autoAssign: selectAutoAssign(state),
    consts: selectUiConstants(),
    receipt: selectReceipt(state),
    chronicle: selectChronicle(state),
    pendingEvent: selectPendingEvent(state),
    pendingDefer: selectPendingDefer(state),
    ending: selectEnding(state),
    toast: state.ui.toast,
    canAdvance: state.phase === 'action' && !state.pendingEvent && !state.ending && selectPendingDefer(state).length === 0,
  };
}

/** 兼容旧存档里的 'crew' 之类的写法。 */
function normalTab(tab) {
  const map = { crew: 'lab', lab: 'lab', projects: 'projects', market: 'market', actions: 'actions', chronicle: 'chronicle' };
  return map[tab] || 'lab';
}

const SVG_NS = 'http://www.w3.org/2000/svg';

/**
 * 画一个图标。
 * @param {string} name ICON_SHAPES 里的 id
 * @param {{class?:string, title?:string, size?:number}} [opts]
 * @returns {Element} <svg class="ico ...">；宿主不支持 SVG 时降级成空的 <span>（脚本/无头环境不至于崩）
 */
function uiIcon(name, opts = {}) {
  const shapes = ICON_SHAPES[name] || null;
  const doc = typeof document === 'undefined' ? null : document;
  const canSvg = Boolean(doc && typeof doc.createElementNS === 'function' && shapes);
  if (!canSvg) {
    return doc ? doc.createElement('span') : null;
  }
  const svg = doc.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('viewBox', ICON_VIEWBOX);
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '2');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.setAttribute('aria-hidden', 'true');
  svg.setAttribute('focusable', 'false');
  svg.setAttribute('class', 'ico' + (opts.class ? ' ' + opts.class : ''));
  if (opts.title) {
    svg.setAttribute('role', 'img');
    svg.removeAttribute('aria-hidden');
    const t = doc.createElementNS(SVG_NS, 'title');
    t.textContent = String(opts.title);
    svg.appendChild(t);
  }
  for (const shape of shapes) {
    const node = doc.createElementNS(SVG_NS, shape.t);
    for (const [k, v] of Object.entries(shape.a)) node.setAttribute(k, v);
    svg.appendChild(node);
  }
  return svg;
}

/* ── src/ui/dom.js ── */
/**
 * dom.js —— UI 的 DOM 工具层与微型组件
 *
 * 原则（docs/CONTRACT.md §6）：
 *   · 视图全部用 createElement 构造节点（可被 scripts/lib/dom-shim.mjs 驱动）。
 *   · 文本一律走 textContent；本文件永不使用 innerHTML。
 *   · 本文件只做「排版与格式化」，不含任何游戏数值计算：数字都来自 vm。
 *   · HUD 里的挂载点是 <span>，所以凡是可能塞进 HUD 的组件都必须用行内元素。
 */




const $ = (id) => document.getElementById(id);

/** 递归拍平 children：数组可以任意嵌套，最终只留节点与文本（浏览器 appendChild 不接受数组）。 */
function uiFlatten(children, out = []) {
  for (const child of [].concat(children)) {
    if (child === null || child === undefined || child === false || child === true) continue;
    if (Array.isArray(child)) uiFlatten(child, out);
    else out.push(child);
  }
  return out;
}

/** 创建元素：h('div', { class:'x', dataset:{a:'1'}, text:'hi', attrs:{title:'…'} }, [child]) */
function h(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  if (attrs.class) node.className = attrs.class;
  if (attrs.text !== undefined && attrs.text !== null) node.textContent = String(attrs.text);
  if (attrs.attrs) for (const [k, v] of Object.entries(attrs.attrs)) node.setAttribute(k, String(v));
  if (attrs.dataset) for (const [k, v] of Object.entries(attrs.dataset)) node.dataset[k] = String(v);
  if (attrs.on) for (const [k, v] of Object.entries(attrs.on)) node.addEventListener(k, v);
  for (const child of uiFlatten(children)) {
    node.appendChild(typeof child === 'object' ? child : document.createTextNode(String(child)));
  }
  return node;
}

function clear(node) {
  if (!node) return node;
  while (node.firstChild) node.removeChild(node.firstChild);
  return node;
}

/** 用新节点替换容器内容。 */
function mount(node, children) {
  if (!node) return node;
  clear(node);
  for (const child of uiFlatten(children)) {
    node.appendChild(typeof child === 'object' ? child : document.createTextNode(String(child)));
  }
  return node;
}

function show(node, visible) {
  if (!node) return node;
  if (visible) node.removeAttribute('hidden');
  else node.setAttribute('hidden', 'hidden');
  return node;
}

/* ── 基础零件 ── */

function uiPctValue(pct) {
  const value = Number(pct);
  if (!Number.isFinite(value)) return 0;
  return Math.max(0, Math.min(100, value));
}

/** 进度条（块级）：pct 0-100。label 可选，显示在右侧。 */
function bar(pct, tone, label) {
  const value = uiPctValue(pct);
  const track = h('div', { class: 'bar ' + (tone ? 'tone-' + tone : ''), dataset: { role: 'bar', value: String(Math.round(value)) } }, [
    h('div', { class: 'bar-fill', attrs: { style: 'width:' + value + '%' } }),
  ]);
  if (label === undefined || label === null || label === '') return track;
  return h('div', { class: 'bar-wrap' }, [track, h('span', { class: 'bar-label', text: String(label) })]);
}

/** 行内迷你进度条（可塞进 HUD 的 span）：pct 0-100。 */
function uiInlineBar(pct, tone) {
  const value = uiPctValue(pct);
  return h('span', { class: 'mini-bar ' + (tone ? 'tone-' + tone : ''), dataset: { role: 'mini-bar', value: String(Math.round(value)) } }, [
    h('span', { class: 'mini-bar-fill', attrs: { style: 'width:' + value + '%' } }),
  ]);
}

/** 小标签。tone：good / bad / warn / info / mute / tier-top … */
function tag(text, tone) {
  return h('span', { class: 'chip ' + (tone ? 'tone-' + tone : ''), text });
}

/** 按钮。dataset 自动带上 data-action；opts: { class, kind, disabled, title } */
function button(label, dataset, opts = {}) {
  const attrs = { type: 'button' };
  if (opts.title) attrs.title = opts.title;
  const cls = ['btn'];
  if (opts.kind) cls.push('btn-' + opts.kind);
  if (opts.class) cls.push(opts.class);
  if (opts.disabled) cls.push('is-disabled');
  const node = h('button', { class: cls.join(' '), text: label, attrs, dataset });
  if (opts.disabled) node.disabled = true;
  return node;
}

/* ── 行内组合件（HUD 专用） ── */

/** 行内「标签 + 数值」：塞进 #hud-* 的 span 里也是合法 HTML。 */
function uiInlineStat(labelText, valueText, tone, icon) {
  return h('span', { class: 'stat' + (tone ? ' tone-' + tone : '') }, [
    icon ? uiIcon(icon) : null,
    h('span', { class: 'stat-k', text: labelText }),
    h('span', { class: 'stat-v', text: valueText === undefined || valueText === null ? '—' : String(valueText) }),
  ]);
}

/** 行内「标签 + 数值 + 迷你条」：精力/健康/诚信这类有上限的资源。 */
function uiInlineMeter(labelText, valueText, pct, tone, icon) {
  return h('span', { class: 'stat stat-meter' + (tone ? ' tone-' + tone : '') }, [
    icon ? uiIcon(icon) : null,
    h('span', { class: 'stat-k', text: labelText }),
    h('span', { class: 'stat-v', text: String(valueText) }),
    uiInlineBar(pct, tone),
  ]);
}

/**
 * 行内分区计数：正刊/一区/二区/三区/四区。
 * 语义（t24 之后，见 docs/GDD.md §2.7）：
 *   · 主数字 r.count ＝ 你的一作篇数（core 只把「你是一作」的论文记进 player.papers，晋升门槛按它算）；
 *   · 副标记 papersFirst[tier] ＝ 其中抢学生 / 花钱买来的一作台账（是子集，不是另一套口径）。
 * 两个数都来自 vm.hud.achievements，UI 不做任何推导。
 */
function uiPaperTiles(ranks, papersFirst) {
  const first = papersFirst || {};
  const tiles = (ranks || []).map((r) => {
    const grabbed = first[r.tier] || 0;
    return h('span', { class: 'paper-tile tone-' + r.tier, dataset: { role: 'paper-tile', tier: r.tier } }, [
      h('span', { class: 'paper-tile-k', text: r.label }),
      h('span', { class: 'paper-tile-v', text: String(r.count) }),
      h('span', {
        class: 'paper-tile-first',
        attrs: { title: UI_PAPER_TILE.title.replace('{tier}', r.label).replace('{count}', String(r.count)).replace('{grabbed}', String(grabbed)) },
        text: UI_PAPER_TILE.first.replace('{n}', String(r.count)),
      }),
      grabbed
        ? h('span', {
          class: 'paper-tile-grabbed',
          attrs: { title: UI_PAPER_TILE.grabbedTitle.replace('{tier}', r.label).replace('{n}', String(grabbed)) },
          text: UI_PAPER_TILE.grabbed.replace('{n}', String(grabbed)),
        })
        : null,
    ]);
  });
  return h('span', { class: 'paper-tiles' }, tiles);
}

/* ── 块级组合件 ── */

/** 卡片：section.card > 头（标题/副标题/右侧操作） + 内容。 */
function uiCard(titleText, subtitleText, rightNodes, children, opts = {}) {
  const head = h('div', { class: 'card-head' }, [
    h('div', { class: 'card-title-wrap' }, [
      h('h2', { class: 'card-title', text: titleText }),

/* ── 格式化（只做展示，不做业务计算） ── */

/** 一位小数，整数不带 .0 */
function uiNum1(v) {
  const n = Number(v);
  if (!Number.isFinite(n)) return '0';
  const r = Math.round(n * 10) / 10;
  return String(r);
}

function fmtMoney(v) {
  return uiNum1(v) + ' 万';
}

function fmtIF(v) {
  return uiNum1(v);
}

function fmtPct(v) {
  return uiNum1(v) + '%';
}

/** 带符号的展示文本：+3 / −2 / 0（负号用 U+2212，排版更整齐）。 */
function uiDeltaText(v, unit) {
  const n = Number(v);
  const suffix = unit ? ' ' + unit : '';
  if (!Number.isFinite(n) || Math.round(n * 10) === 0) return '0' + suffix;
  const abs = uiNum1(Math.abs(n));
  return (n > 0 ? '+' : '−') + abs + suffix;
}

/** 只用于配色的三档视觉阈值（与任何游戏规则无关，纯粹是「看起来要出事」的提示）。 */
function uiLevelTone(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return null;
  if (n <= 20) return 'bad';
  if (n <= 45) return 'warn';
  return 'good';
}

/** 涨跌色调：up / down / flat。 */
function uiDeltaTone(v) {
  const n = Number(v);
  if (!Number.isFinite(n) || Math.round(n * 10) === 0) return 'flat';
  return n > 0 ? 'up' : 'down';
}
// Presentation-only disclosure memory survives store-driven rerenders.
const uiDisclosureState = new Map();
function uiDisclosure(key, label, children, initiallyOpen) {
  const mobile = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(max-width: 600px)').matches;
  const open = uiDisclosureState.has(key) ? uiDisclosureState.get(key) : (initiallyOpen === undefined ? !mobile : initiallyOpen);
  const node = h('details', { class: 'ledger-details', attrs: open ? { open: '' } : {}, on: { toggle: (ev) => uiDisclosureState.set(key, ev.target.open) } }, [h('summary', { text: label }), h('div', { class: 'disclosure-body' }, children)]);
  return node;
}

/** 顶栏主渲染。 */
function renderHud(vm) {
  const hud = vm.hud;
  const ach = hud.achievements;

  // 身份行
  const nameRoot = $('hud-name');
  if (nameRoot) mount(nameRoot, uiNameBlock(hud.name || hud.playerName));
  const sonRoot = $('hud-son');
  if (sonRoot) mount(sonRoot, uiSonBlock(hud.sonName));
  const rankRoot = $('hud-rank');
  if (rankRoot) {
    // 一作空窗提示（t35 第 ① 件）：只看 core 的 stuck，阈值/months 都由 core 给
    const drought = hud.firstAuthorDrought || null;
    const droughtStuck = Boolean(drought && drought.stuck);
    mount(rankRoot, [
      h('span', { class: 'rank-block' }, [
        uiIcon('badge-check'),
        tag(hud.rank.title, hud.rank.eligible ? 'good' : 'info'),
        h('span', { class: 'rank-progress-text', text: hud.rank.index + ' / ' + hud.rank.max }),
      ]),
      droughtStuck
        ? h('span', {
          class: 'drought-hint',
          attrs: {
            title: UI_DROUGHT.title
              .replace('{months}', String(drought.months))
              .replace('{threshold}', String(drought.threshold)),
          },
        }, [
          uiIcon('trending-up'),
          h('span', { class: 'drought-hint-v', text: UI_DROUGHT.tag + '（' + drought.months + ' 个月）' }),
        ])
        : null,
    ]);
  }
  // 年月带日历图标（t27：图标全部内联自绘/ISC，见 docs/ASSETS.md）
  const monthRoot = $('hud-month');
  if (monthRoot) mount(monthRoot, [uiIcon('calendar-days'), h('span', { text: hud.time.text })]);
  uiSetText('hud-age', hud.ageText);
  const waitingDefer = (vm.pendingDefer || []).map((s) => s.name);
  const phaseRoot = $('hud-phase');
  if (phaseRoot) {
    const tone = vm.canAdvance ? 'good' : (vm.ending ? 'bad' : 'warn');
    mount(phaseRoot, [
      tag(hud.phase.label, tone),
      waitingDefer.length ? tag(UI_DEFER.pendingTag + '（延毕）', 'bad') : null,
    ]);
  }

  // 资源行
  const moneyRoot = $('hud-money');
  if (moneyRoot) mount(moneyRoot, [uiInlineStat('经费', uiNum1(hud.money) + ' 万', hud.money < 0 ? 'bad' : null, 'coins')]);
  const consumableRoot = $('hud-consumable');
  if (consumableRoot) {
    mount(consumableRoot, [
      uiInlineStat('耗材资金', uiNum1(hud.consumable) + ' 单位', hud.consumable <= 0 ? 'bad' : null, 'flask-conical'),
      hud.consumableLow ? tag('耗材见底', 'bad') : null,
    ]);
    // t8 finding ⑤：耗材资金的「单位」与「万元」的换算，鼠标停在这里就能看到；
    // 见底时优先显示 core 的强提示（hud.consumableHint）。
    const unit = (vm.consts && vm.consts.consumable) || null;
    if (unit) {
      const unitNote = UI_CONSUMABLE_UNIT.note
        .replace('{unit}', uiNum1(unit.pricePerUnit))
        .replace('{yuan}', uiNum1(unit.pricePerUnit));
      consumableRoot.setAttribute('title', hud.consumableHint ? unitNote + ' · ' + hud.consumableHint : unitNote);
    }
  }
  const energyRoot = $('hud-energy');
  if (energyRoot) {
    const pct = hud.energyMax > 0 ? (hud.energy / hud.energyMax) * 100 : 0;
    mount(energyRoot, [uiInlineMeter('精力', hud.energy + ' / ' + hud.energyMax, pct, uiLevelTone(pct), 'zap')]);
  }
  const healthRoot = $('hud-health');
  if (healthRoot) mount(healthRoot, [uiInlineStat('健康', hud.health, uiLevelTone(hud.health), 'heart-pulse')]);
  const integrityRoot = $('hud-integrity');
  if (integrityRoot) mount(integrityRoot, [uiInlineStat('诚信', hud.integrity, uiLevelTone(hud.integrity), 'shield-check')]);
  const ifRoot = $('hud-if');
  if (ifRoot) mount(ifRoot, [uiInlineStat('总 IF', uiNum1(ach.totalIF), null, 'trending-up')]);
  const firstRoot = $('hud-first');
  if (firstRoot) mount(firstRoot, [uiPaperTiles(ach.ranks, ach.papersFirst)]);
  const ticketRoot = $('hud-tickets');
  if (ticketRoot) mount(ticketRoot, [uiInlineStat('推荐票', hud.tickets, null, 'ticket')]);
  const studentsRoot = $('hud-students');
  if (studentsRoot) mount(studentsRoot, [uiInlineStat('名额', hud.slots.text, null, 'graduation-cap')]);
  const electionRoot = $('hud-election');
  if (electionRoot) {
    mount(electionRoot, [tag('增选窗口开放中', 'good')]);
    show(electionRoot, Boolean(hud.election && hud.election.windowOpen));
  }

  // 操作行：按钮文字与可用性都跟着 vm 走，禁用时给出理由。
  const next = uiSetAction('btn-next-month', 'next-month');
  if (next) {
    const blockedReason = vm.ending
      ? '本局已结束'
      : (waitingDefer.length ? ('先做延毕决定：' + waitingDefer.join('、')) : '先处理弹出的事件');
    next.disabled = !hud.canAdvance;
    next.textContent = hud.canAdvance ? '下一个月 ▶' : blockedReason;
    next.className = 'btn btn-primary btn-next' + (hud.canAdvance ? '' : ' is-idle');
    next.setAttribute('title', hud.canAdvance
      ? '进入月末结算（收入、支出、项目进度、幸福度变化都会列在结算回执里）'
      : (waitingDefer.length ? ('本月不能推进：' + blockedReason + '（延毕还是肄业，选完才走时间）') : '本月还不能推进'));
  }
  uiSetAction('btn-help', 'help');
  uiSetAction('btn-save', 'save');
  uiSetAction('btn-export', 'export');
  uiSetAction('btn-import', 'import');
  uiSetAction('btn-resign', 'resign');
  uiSetAction('btn-reset', 'reset');
  const resign = $('btn-resign');
  if (resign) resign.disabled = Boolean(vm.ending);
  const saveBtn = $('btn-save');
  if (saveBtn && saveBtn.dataset) saveBtn.setAttribute('title', '把当前进度写进浏览器存档（每次月末也会自动存）');
  return vm;
}

/**
 * 某个学生「结题产出的、他是一作」的论文台帐（含已被抢的记录）。
 * 论文台帐由 core 在结题时写进 project.paperTiers，并通过 vm.projects.*[].papers 原样透传。
 */
function uiStudentPapers(vm, studentId) {
  const all = [].concat((vm.projects && vm.projects.list) || [], (vm.projects && vm.projects.archive) || []);
  const order = (vm.consts && vm.consts.papers && vm.consts.papers.order) || [];
  const out = [];
  for (const p of all) {
    const list = Array.isArray(p.papers) ? p.papers : [];
    for (const paper of list) {
      if (!paper || typeof paper !== 'object' || paper.firstAuthorId !== studentId) continue;
      out.push({ paper, projectName: p.name });
    }
  }
  const rank = (tier) => {
    const i = order.indexOf(tier);
    return i < 0 ? order.length : i;
  };
  return out.sort((x, y) => rank(x.paper.tier) - rank(y.paper.tier));
}

/**
 * 「可抢的一作」区块（t8 finding ①②③）：
 *   · 只在「结题产出的、该生为一作、尚未被抢」的论文上渲染按钮（payload 带 paperId + tier）；
 *   · 点击先展开确认条（档位 / 本篇 IF / 诚信 / 该生幸福度 / 心结），确认后才真的抢；
 *   · 本月已经抢过一篇时，按钮置灰并说明（每生每月最多一次）。
 */
function uiGrabBlock(vm, s, ctx) {
  const papers = (vm.consts && vm.consts.papers) || null;
  const rows = uiStudentPapers(vm, s.id);
  const lockedThisMonth = Boolean(s.grabbedPaperThisMonth);
  const pending = ctx && ctx.grabConfirm ? ctx.grabConfirm : null;
  const body = rows.length ? rows.map(({ paper, projectName }) => {
    const label = (papers && papers.labels && papers.labels[paper.tier]) || paper.tier;
    const common = [
      tag(label, paper.grabbed ? 'bad' : 'info'),
      h('span', { class: 'grab-project', text: projectName }),
      h('span', { class: 'grab-if', text: 'IF ' + uiNum1(paper.if) }),
    ];
    if (paper.grabbed) {
      return h('div', { class: 'grab-row is-done' }, common.concat([
        h('span', { class: 'muted', text: UI_GRAB.grabbedAt.replace('{month}', String((paper.grabbedMonthIndex || 0) + 1)) }),
      ]));
    }
    if (!pending || pending.paperId !== paper.paperId) {
      return h('div', { class: 'grab-row', dataset: { role: 'grab-row', paperId: paper.paperId } }, common.concat([
        button(UI_GRAB.button, { action: 'grab-first', studentId: s.id, paperId: paper.paperId, tier: paper.tier },
          { class: 'btn-xs btn-danger-ghost', disabled: lockedThisMonth, title: lockedThisMonth ? UI_GRAB.grabbedThisMonth : UI_GRAB.sectionHint }),
      ]));
    }
    return h('div', { class: 'grab-row is-confirm', dataset: { role: 'grab-confirm', paperId: paper.paperId } }, [
      h('strong', { class: 'grab-confirm-title', text: UI_GRAB.confirmTitle }),
      h('div', { class: 'kv-grid kv-grid-5' }, [
        uiKv(UI_GRAB.gainTier, label),
        uiKv(UI_GRAB.gainIf, uiDeltaText(paper.if)),
        uiKv(UI_GRAB.loseIntegrity, papers ? uiDeltaText(papers.grabIntegrity) : '—'),
        uiKv(UI_GRAB.loseHappy, papers ? uiDeltaText(papers.grabHappy) : '—'),
        uiKv(UI_GRAB.grudge, papers ? (papers.grabGrudgeMonths + ' ' + UI_GRAB.monthsUnit) : '—'),
      ]),
      h('div', { class: 'grab-buttons' }, [
        button(UI_GRAB.confirm, { action: 'grab-confirm' }, { kind: 'danger', class: 'btn-xs' }),
        button(UI_GRAB.cancel, { action: 'grab-cancel' }, { class: 'btn-ghost btn-xs' }),
      ]),
    ]);
  }) : [uiNote(UI_GRAB.noPaper)];
  return h('div', { class: 'grab-block', dataset: { role: 'grab-block', id: s.id } }, [
    h('div', { class: 'grab-head' }, [
      h('span', { class: 'grab-title', text: UI_GRAB.section }),
      h('span', { class: 'muted', text: UI_GRAB.sectionHint }),
      lockedThisMonth ? tag(UI_GRAB.grabbedThisMonth, 'warn') : null,
    ]),
  ].concat(body));
}

/** 三种处理方式 → data-action（写成查表，避免字符串拼接被静态检查误判）。 */
const UI_METHOD_ACTION = { team: 'hardpoint-team', fake: 'hardpoint-fake', solo: 'hardpoint-solo' };

function uiHardpointRow(vm, p, hp) {
  const consts = (vm.consts && vm.consts.hardpoints) || null;
  const methods = (consts && consts.methods) || null;
  const order = (consts && consts.order) || ['team', 'fake', 'solo'];
  const isOpen = hp.status === 'open';
  // t8 finding：成功率与「会被抽调的人」都由 core 算好（vm.projects.*[].hardpoints[].attempts），
  // UI 只负责显示；点击时把 core 给的同一批 studentIds 原样传回引擎，做到所见即所得。
  const attempts = (isOpen && hp.attempts) || null;
  const cost = (id) => {
    if (!methods || !methods[id]) return '';
    const penalty = methods[id].penalty || {};
    const bits = [];
    if (penalty.money) bits.push(uiNum1(penalty.money) + ' 万');
    if (penalty.integrity) bits.push('诚信 ' + uiDeltaText(penalty.integrity));
    if (penalty.teamOtherProjectMul) bits.push('其他项目 ' + uiNum1(penalty.teamOtherProjectMul * 100) + '%');
    if (penalty.studentHappyPerPerson) bits.push(UI_ATTEMPT.perPerson.replace('{happy}', uiDeltaText(penalty.studentHappyPerPerson)));
    else if (penalty.studentHappy) bits.push('幸福 ' + uiDeltaText(penalty.studentHappy));
    return bits.join(' · ');
  };
  const detail = (id) => {
    if (!attempts) return '';
    if (id === 'team') {
      const a = attempts.team;
      const names = a.names.length ? a.names.join('、') : UI_ATTEMPT.pulledNone;
      return UI_ATTEMPT.chance + ' ' + a.pct + '% · ' + UI_ATTEMPT.pulled + names;
    }
    if (id === 'solo') {
      const a = attempts.solo;
      return UI_ATTEMPT.chance + ' ' + a.pct + '% · ' + UI_ATTEMPT.pulled + (a.names[0] || UI_ATTEMPT.pulledNone);
    }
    return UI_ATTEMPT.catch + ' ' + attempts.fake.pct + '%';
  };
  const datasetFor = (id) => {
    const ds = { action: UI_METHOD_ACTION[id], projectId: p.instanceId, hardpointId: hp.id };
    if (attempts && id === 'team' && attempts.team.studentIds.length) ds.studentIds = attempts.team.studentIds.join(',');
    if (attempts && id === 'solo' && attempts.solo.studentIds.length) ds.studentIds = attempts.solo.studentIds.join(',');
    return ds;
  };
  const disabledFor = (id) => {
    if (!attempts) return false;
    if (id === 'team') return !attempts.team.enough;
    if (id === 'solo') return attempts.solo.studentIds.length === 0;
    return false;
  };
  return h('div', { class: 'hardpoint tone-' + (isOpen ? 'warn' : 'mute'), dataset: { role: 'hardpoint', id: hp.id } }, [
    h('div', { class: 'hardpoint-head' }, [
      h('strong', { text: '难点 ' + hp.id }),
      tag('难度 ' + hp.hd, hp.hd >= 3 ? 'bad' : 'warn'),
      tag(hp.statusLabel, hp.status === 'solved' ? 'good' : (hp.status === 'faked' ? 'bad' : 'warn')),
      !isOpen && hp.appearText ? h('span', { class: 'muted', text: hp.appearText }) : null,
    ]),
    isOpen
      ? h('div', { class: 'hardpoint-actions' }, order.map((id) => button(
        ((methods && methods[id] && methods[id].label) || UI_METHOD_LABELS[id] || id) + (detail(id) ? ' · ' + detail(id) : ''),
        datasetFor(id),
        {
          class: 'btn-xs' + (id === 'fake' ? ' btn-danger-ghost' : ''),
          disabled: disabledFor(id),
          title: [
            (methods && methods[id] && methods[id].hint) || UI_METHOD_FILE[id] || '',
            detail(id),
            cost(id),
          ].filter(Boolean).join(' · '),
        },
      )).concat([
        h('span', { class: 'hardpoint-cost', text: order.map((id) => cost(id)).filter(Boolean).join(' / ') }),
        attempts ? h('span', { class: 'hardpoint-cost muted', text: UI_ATTEMPT.retry.replace('{pct}', String(Math.round((attempts.retryBonus || 0) * 100))) }) : null,
      ]))
      : h('p', { class: 'hardpoint-done', text: hp.status === 'faked' ? '蒙混过去了，账先记着。' : '这个难点已经处理完，不再拖进度。' }),
  ]);
}

/**

function uiActionDef(vm, id) {
  const list = (vm.consts && vm.consts.actions) || [];
  return list.filter((d) => d.id === id)[0] || null;
}

function uiCostText(def) {
  if (!def) return '消耗精力';
  const bits = [];
  if (typeof def.energyCost === 'number' && def.energyCost > 0) bits.push('精力 −' + def.energyCost);
  if (typeof def.moneyCost === 'number' && def.moneyCost > 0) bits.push('经费 −' + uiNum1(def.moneyCost) + ' 万');
  else if (def.moneyCost === 'perStudent') bits.push('经费按人头计');
  return bits.length ? bits.join(' · ') : '不花精力也不花钱';
}

/**
 * 每月限次文案。t8 finding ⑥：次数必须与 core 的判定一致——
 * engine.reduceDoAction 用 TALK_PER_STUDENT_PER_MONTH（经 vm.consts.limits 透传），
 * 所以 UI 不再写死「每人每月一次」，而是显示 core 给的数字。
 */
function uiLimitText(vm, def) {
  if (!def) return null;
  if (def.limitPerMonth === 'perStudent') {
    const limits = (vm.consts && vm.consts.limits) || null;
    if (!limits || typeof limits.talkPerStudentPerMonth !== 'number') return '每名学生每月限次';
    return '每人每月最多 ' + limits.talkPerStudentPerMonth + ' 次';
  }
  if (typeof def.limitPerMonth === 'number' && def.limitPerMonth < 90) return '每月最多 ' + def.limitPerMonth + ' 次';
  return null;
}

function uiEntryNode(c, compact) {
  const cls = 'entry tone-' + (c.tone || 'system') + (compact ? ' entry-compact' : '');

  ]);
}

/** 右侧栏：最新几条，密度高一点。 */
function renderChronicleAside(vm) {
  const list = $('chronicle-list');
  if (!list) return;
  const items = vm.chronicle.slice(0, 12);

function uiFilterBar(activeId) {
  return h('div', { class: 'filter-bar' }, UI_CHRONICLE_FILTERS.map((f) => button(f.label, {
    action: 'chronicle-filter', filter: f.id,
  }, { class: 'btn-xs' + (f.id === activeId ? ' active' : ''), kind: f.id === activeId ? 'primary' : null })));
}

function uiMatchFilter(c, filterId) {
  const filter = UI_CHRONICLE_FILTERS.filter((f) => f.id === filterId)[0];
  if (!filter || !filter.kinds) return true;
  return filter.kinds.indexOf(c.kind) >= 0;
}

function uiGrouped(entries) {
  const groups = [];
  let current = null;
  for (const c of entries) {
    const key = '第 ' + c.year + ' 年 ' + c.month + ' 月';
    if (!current || current.key !== key) {
      current = { key, items: [] };
      groups.push(current);
    }
    current.items.push(c);
  }
  return groups.map((g) => h('div', { class: 'chron-group' }, [
    h('h3', { class: 'chron-group-title', text: g.key }),
    h('ul', { class: 'chron-list' }, g.items.map((c) => uiEntryNode(c, false))),
  ]));
}

function renderChroniclePanel(vm, ctx) {
  const panel = $('panel-chronicle');
  if (!panel) return;
  const filterId = (ctx && ctx.chronicleFilter) || 'all';
  const entries = vm.chronicle.filter((c) => uiMatchFilter(c, filterId));
  const body = [uiFilterBar(filterId)];
  if (entries.length) { for (const group of uiGrouped(entries)) body.push(group); }
  else body.push(uiEmpty(filterId === 'all' ? UI_EMPTY.chronicle : '这一类还没有记录。'));
  body.push(uiNote('纪事是 core 写的流水账：结题、论文、学生异动、事件、晋升、结局都会记一句。右侧栏只显示最近几条。'));
  clear(panel);
  panel.appendChild(uiCard('纪事（' + entries.length + ' / ' + vm.chronicle.length + ' 条）', '一整局发生过的事，全在这儿', null, body));
}

/**
 * receipt.js —— 「上月结算回执」：把 core 产出的月报摊开给玩家看
 *
 * 数据来源：vm.receipt（= core 在月末结算里逐项登记的 state.stats.lastReceipt）。
 * 本文件只做排版与格式化：不计算任何游戏数值，也不自己推导账目。
 * 字段（见 src/core/engine.js 的 newReceipt / finalizeReceipt）：
 *   income[] / expense[] / projects[] / students[] / papers[] / events[]
 *   moneyBefore / moneyAfter / moneyNet / consumableNet / ifDelta / integrityDelta / ticketsDelta
 */




function uiDeltaChip(labelText, delta, unit, note) {
  const tone = uiDeltaTone(delta);
  return h('span', { class: 'delta-chip tone-' + tone, dataset: { role: 'delta', key: labelText } }, [
    h('span', { class: 'delta-k', text: labelText }),
    h('span', { class: 'delta-v', text: uiDeltaText(delta, unit) }),
    note ? h('span', { class: 'delta-note', text: note }) : null,
  ]);
}

function uiTimeText(r) {
  return '第 ' + r.year + ' 年 ' + r.month + ' 月';
}

/** 分区 id → 中文标签（标签来自 vm.hud.achievements.ranks，避免 UI 自己维护词典）。 */
function uiTierLabel(vm, tier) {
  const ranks = (vm.hud && vm.hud.achievements && vm.hud.achievements.ranks) || [];
  const hit = ranks.filter((r) => r.tier === tier)[0];
  return hit ? hit.label : tier;
}

function uiPaperCount(receipt) {
  return (receipt.papers || []).reduce((sum, p) => sum + (p.count || 0), 0);
}

/**
 * 月报里的「论文」三项（t24 之后的真实口径）：
 *   · all    本月见刊总数（含学生一作那部分）；
 *   · mine   其中你（老板）是一作的篇数 —— 只有这部分进晋升门槛；
 *   · student 挂在学生名下的篇数。
 * 老存档没有 papersAll/papersStudent 时，退回「按分区计数求和」的旧口径（不显示学生那部分）。
 */
function uiPaperSplit(receipt) {
  const mine = uiPaperCount(receipt);
  const all = receipt.papersAll === undefined || receipt.papersAll === null ? mine : receipt.papersAll;
  const student = receipt.papersStudent === undefined || receipt.papersStudent === null
    ? Math.max(0, all - mine)
    : receipt.papersStudent;
  return { all, mine, student };
}

/** 结算回执条（挂在 index.html 的 #month-report 里，所有标签页都能看到）。 */
function renderReceiptStrip(vm, receipt, openDetail) {
  if (!receipt) {
    return [h('div', { class: 'report report-idle', dataset: { role: 'report' } }, [
      h('div', { class: 'report-head' }, [
        h('strong', { class: 'report-title', text: UI_RECEIPT.title }),
        h('span', { class: 'report-time', text: vm.hud.time.text }),
      ]),
      h('p', { class: 'report-empty', text: UI_RECEIPT.empty }),
    ])];
  }
  const projects = receipt.projects || [];
  const students = receipt.students || [];
  const papers = uiPaperSplit(receipt);
  const events = receipt.events || [];
  return [h('div', { class: 'report', dataset: { role: 'report' } }, [
    h('div', { class: 'report-head' }, [
      h('strong', { class: 'report-title', text: UI_RECEIPT.title }),
      h('span', { class: 'report-time', text: uiTimeText(receipt) }),
      h('span', { class: 'report-total', text: '进项 ' + (receipt.income || []).length + ' 笔 · 出项 ' + (receipt.expense || []).length + ' 笔' }),
      openDetail ? button('看明细', { action: 'receipt-open' }, { class: 'btn-ghost btn-xs' }) : null,
    ]),
    h('div', { class: 'report-chips' }, [
      uiDeltaChip('经费', receipt.moneyNet || 0, '万'),
      // 这里给的是「本月净变化」，后面补上当前库存，避免读成「库存为负」（t6 finding）
      uiDeltaChip(UI_RECEIPT.consumableLabel, receipt.consumableNet || 0, '单位',
        UI_RECEIPT.consumableStock.replace('{stock}', uiNum1(receipt.consumableAfter))),
      uiDeltaChip('总 IF', receipt.ifDelta || 0),
      uiDeltaChip('诚信', receipt.integrityDelta || 0),
      uiDeltaChip('推荐票', receipt.ticketsDelta || 0),
      papers.all ? h('span', { class: 'delta-chip tone-up' }, [
        h('span', { class: 'delta-k', text: '论文' }),
        h('span', { class: 'delta-v', text: papers.all + ' 篇' }),
        h('span', { class: 'delta-note', text: '你的一作 ' + papers.mine + ' 篇' }),
      ]) : null,
      events.length ? h('span', { class: 'delta-chip tone-flat' }, [h('span', { class: 'delta-k', text: '事件' }), h('span', { class: 'delta-v', text: events.length + ' 起' })]) : null,
    ]),
    h('div', { class: 'report-lines' }, [
      projects.length
        ? h('div', { class: 'report-line' }, [h('span', { class: 'report-line-k', text: '项目' })].concat(projects.map((p) => h('span', {
          class: 'report-chip tone-' + (p.starved ? 'down' : (p.progressDelta > 0 ? 'up' : 'flat')),
        }, [
          h('span', { text: p.name }),
          h('span', { class: 'report-chip-v', text: p.starved ? '耗材断供' : uiDeltaText(p.progressDelta, '点') }),
        ]))))
        : h('div', { class: 'report-line muted', text: UI_RECEIPT.noProject }),
      students.length
        ? h('div', { class: 'report-line' }, [h('span', { class: 'report-line-k', text: '学生' })].concat(students.map((s) => h('span', {
          class: 'report-chip tone-' + (s.happyDelta < 0 ? 'down' : (s.happyDelta > 0 ? 'up' : 'flat')),
        }, [
          h('span', { text: s.name }),
          h('span', { class: 'report-chip-v', text: s.note ? s.note : ('心情 ' + uiDeltaText(s.happyDelta)) }),
        ]))))
        : h('div', { class: 'report-line muted', text: UI_RECEIPT.noStudent }),
    ]),
    papers.all ? h('div', { class: 'report-papers', text: '本月见刊 ' + papers.all + ' 篇，其中你的一作 ' + papers.mine + ' 篇'
      + (papers.student ? '（另外 ' + papers.student + ' 篇挂学生名下）' : '')
      + '：' + (receipt.papers || []).map((p) => uiTierLabel(vm, p.tier) + ' ' + p.count + ' 篇').join(' · ') }) : null,
    events.length ? h('div', { class: 'report-events', text: '本月事件：' + events.join('；') }) : null,
  ])];
}

/** 结算明细（弹层内容）：收入/支出逐笔列出。 */
function renderReceiptDetail(vm, receipt) {
  if (!receipt) return [uiEmpty(UI_RECEIPT.empty)];
  const income = receipt.income || [];
  const expense = receipt.expense || [];
  const projects = receipt.projects || [];
  const students = receipt.students || [];
  const papers = uiPaperSplit(receipt);
  const rows = [
    uiKv('经费（万）', uiNum1(receipt.moneyBefore) + ' → ' + uiNum1(receipt.moneyAfter) + '（' + uiDeltaText(receipt.moneyNet) + '）', uiDeltaTone(receipt.moneyNet)),
    uiKv(UI_RECEIPT.consumableDetailLabel,
      uiDeltaText(receipt.consumableNet) + UI_RECEIPT.consumableStock.replace('{stock}', uiNum1(receipt.consumableAfter)),
      uiDeltaTone(receipt.consumableNet)),
    papers.all ? uiKv('本月见刊（篇）', papers.all + ' 篇（你的一作 ' + papers.mine + ' 篇' + (papers.student ? ' · 学生 ' + papers.student + ' 篇' : '') + '）') : null,
    uiKv('总影响因子', uiDeltaText(receipt.ifDelta), uiDeltaTone(receipt.ifDelta)),

  ];
  const sections = [h('div', { class: 'receipt-time', text: '结算月份：' + uiTimeText(receipt) }), h('div', { class: 'kv-grid' }, rows)];

  sections.push(h('h3', { class: 'receipt-h', text: '进项（' + income.length + '）' }));
  sections.push(income.length
    ? h('ul', { class: 'receipt-list' }, income.map((it) => h('li', {}, [

    ])))
    : uiNote('本月没有进项。'));

  sections.push(h('h3', { class: 'receipt-h', text: '出项（' + expense.length + '）' }));
  sections.push(expense.length

/** 主渲染：core 事件/结局优先，其次是玩家自己打开的弹层。 */
function renderModal(vm, localUi) {
  const root = $('modal-root');
  if (!root) return;
  const ui = localUi || {};
  const localKind = ui.modal ? ui.modal.kind : null;
  clear(root);
  let node = null;
  if (vm.ending && !ui.hideEnding) node = uiEndingScreen(vm);
  else if (localKind === 'help') node = uiHelpModal(vm);
  else if (localKind === 'rename') node = uiRenameModal(vm);
  else if (localKind === 'receipt') node = uiModalShell('结算明细', null, 'plain', renderReceiptDetail(vm, vm.receipt), [button('知道了', { action: 'modal-close' }, { kind: 'primary' })]);
  else if (localKind === 'reset') node = uiResetModal();
  else if (localKind === 'resign-confirm' || localKind === 'resign') node = uiResignModal();
  else if (localKind === 'defer-boss') node = uiDeferBossModal(vm, ui);
  else if (vm.pendingEvent) node = uiEventModal(vm.pendingEvent);
  else if (vm.pendingDefer && vm.pendingDefer.length) node = uiDeferModal(vm);
  if (node) mount(root, [node]);
}

/** toast：core 通过 state.ui.toast 给的一句反馈（失败原因、超额提醒等）。 */

    h('span', { class: 'toast-text', text: vm.toast }),

  ])]);
}

/**

function createApp(options) {
  const store = options.store;
  const io = options.io || {};
  const root = $('app');
  let unsubscribe = null;
  let lastVm = null;
  const localUi = {

    hideEnding: false,
    introDone: false,

    grabConfirm: null,
    // v1.4.0 稀有人才：招走即永不再现，所以招募也要二次确认（只记「正在确认哪个 offer」，不写 state）

    projectsIntroDone: false,

    labPick: null,

  const HANDLERS = {
    'next-month': () => advanceMonth(),
    'save': () => (typeof io.onSave === 'function' ? io.onSave() : null),
    'export': () => (typeof io.onExport === 'function' ? io.onExport() : null),
    'import': () => (typeof io.onImport === 'function' ? io.onImport() : null),
    'reset': () => {
