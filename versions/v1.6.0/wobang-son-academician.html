/* ── 子标签 ── */
.subtabs { display: flex; gap: var(--sp-1); flex-wrap: wrap; padding: var(--sp-1); background: var(--paper-bg-2); border: 1px solid var(--line-strong); border-radius: var(--r-2); }
.subtab { appearance: none; border: 1px solid transparent; background: transparent; padding: var(--sp-2) var(--sp-4); border-radius: var(--r-1); cursor: pointer; color: var(--ink-soft); font-size: var(--fs-sm); letter-spacing: 0.04em; }
.subtab:hover { background: rgba(255,255,255,0.7); color: var(--ink-strong); }
.subtab.active { background: var(--paper-card); border-color: var(--line-strong); color: var(--ink-strong); font-weight: 700; box-shadow: var(--sh-1); }

/* ── 结算回执 ── */
.report { background: var(--paper-card); border: 1px solid var(--line-strong); border-left: 4px solid var(--jade); border-radius: var(--r-2); padding: var(--sp-3) var(--sp-4); display: grid; gap: var(--sp-2); box-shadow: var(--sh-1); }
.report-idle { border-left-color: var(--line-strong); }
.report-head { display: flex; align-items: baseline; gap: var(--sp-3); flex-wrap: wrap; }
.report-title { font-family: var(--font-title); font-size: var(--fs-lg); letter-spacing: 0.1em; }
.report-time { font-family: var(--font-num); font-size: var(--fs-xs); color: var(--ink-faint); }
.report-empty { font-size: var(--fs-sm); color: var(--ink-faint); }
.report-chips { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.delta-chip { display: inline-flex; align-items: baseline; gap: var(--sp-1); padding: 2px var(--sp-2); border-radius: var(--r-1); border: 1px solid var(--line); background: var(--paper-tint); }
.delta-k { font-size: var(--fs-xs); color: var(--ink-faint); }
.delta-v { font-family: var(--font-num); font-weight: 700; }
.tone-up .delta-v, .delta-chip.tone-up .delta-v { color: var(--up); }
.tone-down .delta-v, .delta-chip.tone-down .delta-v { color: var(--down); }
.tone-flat .delta-v, .delta-chip.tone-flat .delta-v { color: var(--flat); }
.report-lines { display: grid; gap: var(--sp-1); }
.report-line { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); font-size: var(--fs-sm); }
.report-line-k { font-size: var(--fs-xs); color: var(--ink-faint); letter-spacing: 0.1em; min-width: 34px; }
.report-chip { display: inline-flex; gap: var(--sp-1); align-items: baseline; padding: 1px var(--sp-2); border-radius: var(--r-1); background: var(--paper-sunken); border: 1px solid var(--line); }
.report-chip-v { font-family: var(--font-num); font-size: var(--fs-xs); }
.report-chip.tone-up .report-chip-v { color: var(--up); }
.report-chip.tone-down .report-chip-v { color: var(--down); }
.report-papers { font-size: var(--fs-sm); color: var(--jade); }
.report-total { font-size: var(--fs-xs); color: var(--ink-faint); }
.report-events { font-size: var(--fs-sm); color: var(--gold); }

.receipt-time { font-size: var(--fs-sm); color: var(--ink-soft); }
.receipt-h { font-family: var(--font-title); font-size: var(--fs-lg); letter-spacing: 0.08em; margin-top: var(--sp-2); border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.receipt-list { display: grid; gap: var(--sp-2); }
.receipt-list li { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }
.receipt-li-name { min-width: 74px; font-weight: 700; }
.receipt-li-v { font-family: var(--font-num); font-size: var(--fs-sm); color: var(--ink-soft); }
.receipt-li-kind { font-size: var(--fs-xs); color: var(--ink-faint); min-width: 62px; }
.receipt-list .bar { max-width: 320px; }
.receipt-list li.tone-bad .receipt-li-kind { color: var(--bad); }
.receipt-list li.tone-good .receipt-li-kind { color: var(--good); }
.receipt-list li.tone-absurd .receipt-li-kind { color: var(--gold); }

/* ── 学生 / 候选人 / offer ── */
.student-list, .candidate-grid, .offer-list { display: grid; gap: var(--sp-3); }
.student, .candidate, .offer, .project {
  border: 1px solid var(--line);
  border-left: 3px solid var(--line-strong);
  border-radius: var(--r-2);
  padding: var(--sp-3) var(--sp-4);
  background: var(--paper-tint);
  display: grid;
  gap: var(--sp-2);
}
.student.tone-good, .candidate.tone-good, .offer.tone-good, .project.tone-good { border-left-color: var(--good); }
.student.tone-bad, .project.tone-bad, .offer.tone-mute { border-left-color: var(--bad); }
.student.tone-normal { border-left-color: var(--warn); }
.candidate.tone-mute { border-left-color: var(--line-strong); }

.student-head, .candidate-head, .offer-head, .project-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }
.student-name, .candidate-name, .offer-name, .project-name { font-family: var(--font-title); font-size: var(--fs-lg); letter-spacing: 0.04em; }
.student-bars { display: grid; gap: 2px; }
.student-bar { display: flex; align-items: center; gap: var(--sp-2); }
.student-bar-k { font-size: var(--fs-xs); color: var(--ink-soft); min-width: 92px; }
.student-bar .mini-bar { width: 120px; }
.student-projects, .project-papers { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; font-size: var(--fs-sm); }
.proj-chip { display: inline-flex; gap: var(--sp-1); align-items: baseline; padding: 1px var(--sp-2); border-radius: var(--r-1); background: var(--paper-card); border: 1px solid var(--line); }
.proj-chip-v { font-family: var(--font-num); font-size: var(--fs-xs); color: var(--jade); }
.student-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; border-top: 1px dashed var(--line-strong); padding-top: var(--sp-2); }
.wage-row { display: inline-flex; align-items: center; gap: var(--sp-1); }
.wage-k { font-size: var(--fs-xs); color: var(--ink-faint); }
.wage-cost { font-family: var(--font-num); font-size: var(--fs-xs); color: var(--ink-soft); }

.candidate-ability { display: flex; align-items: center; gap: var(--sp-3); }
.candidate-ability-k { font-size: var(--fs-sm); color: var(--ink-soft); min-width: 82px; }
.candidate-ability .bar { max-width: 260px; }
.candidate-actions, .offer-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }
.candidate .kv-grid-3, .student .kv-grid-3 { grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); }

/* v1.4.0 稀有人才：卡片要一眼认得出来（铜金 + 印章红，全部复用现有令牌，不引新色） */
.candidate-rare { border-left-color: var(--gold); background: linear-gradient(180deg, var(--gold-soft), transparent 68%); }
.candidate-rare .candidate-name { color: var(--seal-deep); }
.candidate-rare-flavor { margin: var(--sp-1) 0 0; font-size: var(--fs-sm); color: var(--gold); }
.candidate-confirm { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); margin-top: var(--sp-3); padding: var(--sp-2) var(--sp-3); border: 1px dashed var(--seal); border-radius: var(--r-3); background: var(--seal-soft); }
.candidate-confirm-title { color: var(--seal-deep); font-size: var(--fs-sm); }
.candidate-confirm-text { font-size: var(--fs-sm); color: var(--ink-soft); }

.offer-meta, .project-meta, .equip-stats { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-5); }
.alumni { border-top: 1px dashed var(--line-strong); padding-top: var(--sp-3); }
.alumni-title { font-size: var(--fs-sm); color: var(--ink-soft); letter-spacing: 0.08em; margin-bottom: var(--sp-1); }
.alumni-list { display: flex; flex-wrap: wrap; gap: var(--sp-3); font-size: var(--fs-sm); color: var(--ink-faint); }

.shop-row { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; }
.shop-note { font-size: var(--fs-sm); color: var(--ink-soft); }

/* ── 难点 ── */
.hardpoints { display: grid; gap: var(--sp-2); }
.hardpoint { border: 1px dashed var(--line-strong); border-radius: var(--r-2); padding: var(--sp-2) var(--sp-3); display: grid; gap: var(--sp-2); background: var(--paper-card); }
.hardpoint.tone-warn { border-color: var(--warn); background: var(--warn-soft); }
.hardpoint-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }
.hardpoint-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }
.hardpoint-cost { font-size: var(--fs-xs); color: var(--ink-faint); }
.hardpoint-done { font-size: var(--fs-sm); color: var(--ink-soft); }

.assign-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); border-top: 1px dashed var(--line-strong); padding-top: var(--sp-2); }
.assign-k { font-size: var(--fs-xs); color: var(--ink-faint); letter-spacing: 0.1em; }

/* ── 仪器 / 耗材 / 行动 ── */
.equip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: var(--sp-3); }
.equip { border: 1px solid var(--line); border-left: 3px solid var(--line-strong); border-radius: var(--r-2); padding: var(--sp-3); background: var(--paper-tint); display: grid; gap: var(--sp-2); }
.equip.tone-major { border-left-color: var(--jade); }
.equip.tone-minor { border-left-color: var(--blue); }
.equip.tone-bad { border-left-color: var(--bad); background: var(--bad-soft); }
.equip-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }
.equip-name { font-family: var(--font-title); font-size: var(--fs-lg); }
.equip-stats { gap: var(--sp-2) var(--sp-4); }
.equip-buy { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }

.buy-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3); }
.mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: var(--sp-3); }
.mode { border: 1px solid var(--line); border-radius: var(--r-2); padding: var(--sp-3); background: var(--paper-tint); display: grid; gap: var(--sp-2); }
.mode.active { border-color: var(--seal); background: var(--seal-soft); }
.mode-head { display: flex; align-items: center; gap: var(--sp-2); }
.mode-hint { font-size: var(--fs-sm); color: var(--ink-soft); }
.mode-nums { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); }

.action-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--sp-3); }
.action-card { border: 1px solid var(--line); border-top: 3px solid var(--jade); border-radius: var(--r-2); padding: var(--sp-3) var(--sp-4); background: var(--paper-tint); display: grid; gap: var(--sp-2); align-content: start; }
.action-card.is-locked { border-top-color: var(--line-strong); opacity: 0.85; }
.action-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }
.action-name { font-family: var(--font-title); font-size: var(--fs-lg); }
.action-hint { font-size: var(--fs-sm); color: var(--ink-soft); }
.talk-picker { display: grid; gap: var(--sp-2); }
.talk-row { border: 1px dashed var(--line-strong); border-radius: var(--r-2); padding: var(--sp-2) var(--sp-3); display: grid; gap: var(--sp-2); background: var(--paper-card); }
.talk-row-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }
.talk-projects { display: flex; flex-wrap: wrap; gap: var(--sp-2); }

/* ── 档案 ── */
.archive-list { display: grid; gap: var(--sp-1); }
.archive-item { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3); border-bottom: 1px dotted var(--line); font-size: var(--fs-sm); }
.archive-name { font-weight: 700; min-width: 120px; }
.archive-meta { font-family: var(--font-num); color: var(--ink-soft); font-size: var(--fs-xs); }

/* ── 纪事 ── */
.entry { display: grid; grid-template-columns: 78px 1fr; gap: var(--sp-2); padding: var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-3); border-left: 3px solid var(--line-strong); background: var(--paper-tint); border-radius: 0 var(--r-1) var(--r-1) 0; font-size: var(--fs-sm); }
.entry-time { font-family: var(--font-num); font-size: var(--fs-xs); color: var(--ink-faint); }
.entry.tone-good { border-left-color: var(--good); }
.entry.tone-bad { border-left-color: var(--bad); }
.entry.tone-absurd { border-left-color: var(--gold); }
.entry.tone-system { border-left-color: var(--blue); }
.entry-compact { grid-template-columns: 1fr; gap: 0; font-size: var(--fs-xs); }
.entry-compact .entry-time { font-size: 10px; letter-spacing: 0.06em; }
.filter-bar { display: flex; flex-wrap: wrap; gap: var(--sp-1); }
.chron-group { display: grid; gap: var(--sp-1); }
.chron-group-title { font-family: var(--font-title); font-size: var(--fs-md); color: var(--ink-soft); border-bottom: 1px solid var(--line); letter-spacing: 0.08em; }
.chron-list { display: grid; gap: var(--sp-1); }

/* ── 弹层 ── */
#modal-root:empty { display: none; }
.modal-backdrop { position: fixed; inset: 0; z-index: var(--z-modal); background: rgba(38, 30, 16, 0.42); display: grid; place-items: center; padding: var(--sp-4); overflow: auto; }
.modal { width: min(720px, 96vw); max-height: 92vh; overflow: auto; background: var(--paper-card); border: 1px solid var(--line-strong); border-top: 5px solid var(--ink-strong); border-radius: var(--r-3); box-shadow: var(--sh-3); display: grid; }
.modal.tone-warn { border-top-color: var(--warn); }
.modal.tone-bad { border-top-color: var(--bad); }
.modal.tone-success { border-top-color: var(--seal); }
.modal.tone-info { border-top-color: var(--blue); }
.modal.tone-neutral { border-top-color: var(--ink-faint); }
.modal-head { padding: var(--sp-5) var(--sp-5) var(--sp-3); border-bottom: 1px solid var(--line); background: linear-gradient(180deg, var(--paper-tint), transparent); }
.modal-title { font-family: var(--font-title); font-size: var(--fs-2xl); letter-spacing: 0.06em; }
.modal-sub { font-size: var(--fs-sm); color: var(--ink-faint); margin-top: var(--sp-1); }
.modal-body { padding: var(--sp-4) var(--sp-5); display: grid; gap: var(--sp-3); }
.modal-actions { padding: var(--sp-3) var(--sp-5) var(--sp-5); display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; }
.event-text { font-size: var(--fs-lg); line-height: 1.8; }
.choice { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3); }
.choice-btn { min-width: 168px; text-align: left; }
.choice-hint { font-size: var(--fs-sm); color: var(--ink-soft); }
.field { display: grid; gap: var(--sp-1); }
.field-k { font-size: var(--fs-xs); color: var(--ink-faint); letter-spacing: 0.1em; }
.field-hint { font-size: var(--fs-xs); color: var(--ink-faint); }
.text-input { font: inherit; padding: var(--sp-2) var(--sp-3); border: 1px solid var(--line-strong); border-radius: var(--r-2); background: var(--paper-sunken); color: var(--ink-strong); max-width: 320px; }
.text-input:focus { background: var(--paper-card); }
.help-block { display: grid; gap: 2px; }
.help-title { font-family: var(--font-title); font-size: var(--fs-lg); color: var(--seal-deep); }
.help-text { font-size: var(--fs-sm); color: var(--ink); line-height: 1.75; }

/* ── v1.5.0 游戏内百科（帮助弹层内，10 章） ──
   窄屏防溢出口径：每一层网格都用 minmax(0, …)，文本 overflow-wrap:anywhere，
   .wiki-* 里不出现任何固定 min-width —— 375px 手机宽度不得横向滚动。 */
.wiki { display: grid; gap: var(--sp-4); min-width: 0; }
.wiki-head { display: grid; gap: 2px; min-width: 0; }
.wiki-title { font-family: var(--font-title); font-size: var(--fs-xl); color: var(--seal-deep); }
.wiki-sub { font-size: var(--fs-sm); color: var(--ink-soft); line-height: 1.7; }
.wiki-index { display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-2); min-width: 0; }
.wiki-index-chip { font-size: var(--fs-xs); color: var(--ink-soft); border: 1px solid var(--line); border-radius: var(--r-2); padding: 2px var(--sp-2); }
.wiki-body { display: grid; gap: var(--sp-4); min-width: 0; }
.wiki-chapter { display: grid; gap: var(--sp-2); min-width: 0; padding-top: var(--sp-2); border-top: 1px solid var(--line); }
.wiki-chapter-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--sp-2); min-width: 0; }
.wiki-chapter-no { font-size: var(--fs-xs); color: var(--ink-faint); letter-spacing: 0.1em; }
.wiki-chapter-name { font-family: var(--font-title); font-size: var(--fs-lg); color: var(--seal-deep); }
.wiki-intro { font-size: var(--fs-sm); color: var(--ink-soft); line-height: 1.75; overflow-wrap: anywhere; }
.wiki-rows { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; min-width: 0; }
.wiki-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: var(--sp-1) var(--sp-2); padding: var(--sp-1) 0; border-bottom: 1px dotted var(--line); min-width: 0; }
.wiki-k { font-size: var(--fs-sm); color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
.wiki-v { font-family: var(--font-num); color: var(--ink-strong); text-align: right; overflow-wrap: anywhere; }
.wiki-note { grid-column: 1 / -1; font-size: var(--fs-xs); color: var(--ink-faint); line-height: 1.6; overflow-wrap: anywhere; }
.wiki-foot { font-size: var(--fs-xs); color: var(--ink-faint); line-height: 1.6; }

/* ── 结局画面 ── */
.end-text { font-family: var(--font-title); font-size: var(--fs-lg); line-height: 1.9; padding: var(--sp-4); background: var(--paper-sunken); border-left: 4px solid var(--seal); border-radius: 0 var(--r-2) var(--r-2) 0; }
.end-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--sp-2) var(--sp-4); }
.end-kv { display: flex; justify-content: space-between; gap: var(--sp-3); border-bottom: 1px dotted var(--line-strong); padding: var(--sp-2) 0; }
.end-k { font-size: var(--fs-xs); color: var(--ink-faint); letter-spacing: 0.08em; }
.end-v { font-family: var(--font-num); color: var(--ink-strong); }
.end-foot { font-size: var(--fs-xs); color: var(--ink-faint); }

/* ── toast ── */
#toast-root:empty { display: none; }
.toast { position: fixed; left: 50%; bottom: var(--sp-6); transform: translateX(-50%); z-index: var(--z-toast); display: flex; align-items: center; gap: var(--sp-3); max-width: min(680px, 92vw); padding: var(--sp-3) var(--sp-4); background: var(--ink-strong); color: var(--paper-card); border-radius: var(--r-3); box-shadow: var(--sh-3); }
.toast-text { font-size: var(--fs-sm); }
.toast .btn-ghost { color: var(--paper-card); border-color: rgba(255,255,255,0.35); }
.toast .chip.tone-warn { background: var(--warn); border-color: var(--warn); color: #fff6e2; }

/* ── 大屏（1920 / 1440）：侧栏更宽、正文略放大 ── */
@media (min-width: 1600px) {
  #app { grid-template-columns: minmax(0, 1fr) minmax(320px, 356px); }
  :root { --fs-md: 14px; --fs-lg: 16px; --fs-xl: 20px; }
  #chronicle-wrap { top: 226px; }
}

/* ── 窄屏与低分辨率 ── */
@media (max-width: 1279px) {
  #app { grid-template-columns: minmax(0, 1fr); }
  #chronicle-wrap { position: static; max-height: 320px; top: auto; }
}

@media (max-width: 900px) {
  :root { --fs-md: 13px; --fs-xl: 17px; --fs-2xl: 21px; }
  #app { padding: 0 var(--sp-3) var(--sp-6); gap: var(--sp-3); }
  #top-bar { margin: 0 calc(var(--sp-3) * -1); padding: var(--sp-3) var(--sp-3) 0; }
  .brand-text span { display: none; }
  .hud-identity { justify-content: flex-start; }
  .hud-controls { justify-content: flex-start; }
  #tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .tab { padding: var(--sp-2) var(--sp-3); white-space: nowrap; }
  .card-body, .card-head { padding-left: var(--sp-3); padding-right: var(--sp-3); }
  .kv-grid, .kv-grid-2, .kv-grid-3 { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
  .entry { grid-template-columns: 1fr; }
  .entry-time { color: var(--ink-faint); }
  .badge, .chip { white-space: normal; }
  .modal { width: 100%; }
  .choice-btn { min-width: 0; width: 100%; }
}

@media (max-width: 560px) {
  .hud-controls .btn { flex: 1 1 auto; }
  .slot-row { flex-direction: column; gap: var(--sp-1); }
  .student-bar-k { min-width: 76px; }
  .student-bar .mini-bar { width: 84px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ─────────────── t10 修复轮：一作台帐 / 延毕决定 / 难点成功率 / 论文台帐 / 耗材单位 ─────────────── */

/* 「可抢的一作」：每篇论文一行，未抢的给按钮，已抢的灰掉 */
.grab-block { margin-top: var(--sp-3); padding-top: var(--sp-2); border-top: 1px dashed var(--line); }
.grab-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); margin-bottom: var(--sp-1); }
.grab-title { font-weight: 700; color: var(--ink-strong); }
.grab-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); padding: var(--sp-1) 0; border-bottom: 1px dotted var(--line-soft); }
.grab-row.is-done { opacity: 0.7; }
.grab-row.is-confirm { display: block; padding: var(--sp-3); margin: var(--sp-2) 0; border: 1px solid var(--seal); border-radius: var(--r-3); background: var(--seal-soft); }
.grab-project { color: var(--ink); }
.grab-if { font-family: var(--font-num); color: var(--blue); }
.grab-buttons { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-2); }

/* 延毕决定弹层：二选一，两边都把后果写全 */
.defer-row { padding: var(--sp-4); margin-bottom: var(--sp-4); border: 1px solid var(--line-strong); border-radius: var(--r-3); background: var(--paper-tint); }
.defer-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--sp-2); margin-bottom: var(--sp-3); }
.defer-name { font-size: var(--fs-lg); color: var(--ink-strong); }
.defer-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--sp-4); }
.defer-choice { display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-1); }
.defer-foot { margin-top: var(--sp-2); color: var(--ink-soft); font-size: var(--fs-sm); }

/* 结题档案里的论文台帐 */
.paper-ledger { margin: var(--sp-2) 0 0; padding: 0; list-style: none; }
.paper-ledger-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); padding: 2px 0; font-size: var(--fs-sm); }
.paper-ledger-if { font-family: var(--font-num); color: var(--blue); }
.paper-ledger-author { color: var(--ink-soft); }

/* 耗材单位说明 */
.unit-notes { margin: var(--sp-2) 0; }
.unit-notes .note { margin: 2px 0; }

/* 难点按钮现在带「成功率 · 将抽调：X、Y」，允许换行、左对齐 */
.hardpoint-actions .btn { max-width: 100%; text-align: left; white-space: normal; line-height: 1.45; }
.hardpoint-actions .hardpoint-cost { white-space: normal; }

@media (max-width: 900px) {
  .defer-choices { grid-template-columns: 1fr; }
  .grab-row { align-items: flex-start; }
}

/* ───────────────── t27：内联图标与观感（素材登记见 docs/ASSETS.md） ───────────────── */
/* 图标统一 1em 见方、跟随 currentColor 与字号着色（Lucide，ISC，24×24 网格） */
.ico { width: 1em; height: 1em; flex: 0 0 auto; vertical-align: -0.12em; opacity: 0.82; }
.stat .ico { width: 0.95em; height: 0.95em; }
.stat.tone-good .ico, .stat.tone-warn .ico, .stat.tone-bad .ico { opacity: 1; }
.tab .ico { width: 1.05em; height: 1.05em; margin-right: 2px; vertical-align: -0.16em; opacity: 0.7; }
.tab.active .ico { opacity: 1; }
.rank-block .ico { margin-right: 2px; opacity: 0.9; }
.delta-note { color: var(--ink-faint); font-size: var(--fs-xs); font-weight: 400; letter-spacing: 0; }

@media (max-width: 900px) {
  .tab .ico { margin-right: 0; }
}

/* ── t35：顶栏一作空窗提示 + T21-F2 空态分支 ── */
.drought-hint { display: inline-flex; align-items: center; gap: 2px; margin-left: var(--sp-2); padding: 1px var(--sp-2); border: 1px solid var(--seal); border-radius: var(--radius-xs); background: var(--seal-soft); color: var(--seal-deep); font-size: var(--fs-xs); white-space: nowrap; cursor: help; }
.drought-hint .ico { width: 0.95em; height: 0.95em; opacity: 0.9; }
.drought-hint-v { letter-spacing: 0.04em; }
.auto-assign-nomarket { margin: 0; font-size: var(--fs-xs); color: var(--seal-deep); line-height: 1.6; }


/* ── t34：新手引导（DEV §7.4）—— 总览缺一作提示 / 首次进项目页引导 ── */
.first-author-hint { display: flex; flex-direction: column; gap: var(--sp-1); margin-top: var(--sp-2); padding: var(--sp-2) var(--sp-3); border-left: 3px solid var(--seal); background: var(--seal-soft); border-radius: var(--radius-xs); }
.first-author-hint-v { margin: 0; font-size: var(--fs-sm); color: var(--ink-strong); line-height: 1.65; }
.first-author-hint-routes { margin: 0; font-size: var(--fs-xs); color: var(--ink-soft); line-height: 1.65; }
.projects-intro { display: flex; flex-direction: column; gap: var(--sp-1); margin-bottom: var(--sp-3); padding: var(--sp-3); border: 1px solid var(--seal); border-left-width: 4px; border-radius: var(--radius-sm); background: var(--seal-soft); }
.projects-intro-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }
.projects-intro-title { font-family: var(--font-title); font-size: var(--fs-md); color: var(--seal-deep); letter-spacing: 0.04em; }
.projects-intro-text { margin: 0; font-size: var(--fs-sm); color: var(--ink-strong); line-height: 1.7; }
.projects-intro-hint { margin: 0; font-size: var(--fs-xs); color: var(--ink-soft); line-height: 1.65; }


/* ── t26：一键分配工作 / 论文分区语义 / 亲带提示 ── */
.auto-assign-block { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3); margin-bottom: var(--sp-2); border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); background: var(--paper-tint); }
.auto-assign-row { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
.auto-assign-preview { font-size: var(--fs-sm); color: var(--ink-soft); }
.auto-assign-plan { display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: baseline; }
.auto-assign-plan-k { font-size: var(--fs-xs); color: var(--ink-faint); letter-spacing: 0.06em; }
.auto-assign-plan-v { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
.auto-assign-plan-item { font-size: var(--fs-xs); font-family: var(--font-num); color: var(--ink-soft); background: var(--paper-sunken); border: 1px solid var(--line); border-radius: var(--radius-xs); padding: 1px var(--sp-2); }
.auto-assign-last { display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: baseline; font-size: var(--fs-sm); }
.auto-assign-last-k { font-size: var(--fs-xs); color: var(--ink-faint); letter-spacing: 0.06em; }
.auto-assign-last-v { color: var(--ink-strong); font-weight: 600; }
.auto-assign-last-hint { color: var(--ink-faint); font-size: var(--fs-xs); }
.auto-assign-chips-row { display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: baseline; font-size: var(--fs-xs); }
.auto-assign-chips-k { color: var(--ink-faint); letter-spacing: 0.06em; }
.auto-assign-chips-v { display: flex; gap: var(--sp-1); flex-wrap: wrap; }
.auto-assign-boundary { margin: 0; font-size: var(--fs-xs); color: var(--ink-faint); line-height: 1.6; }
.lead-note { margin: var(--sp-1) 0 0; font-size: var(--fs-xs); color: var(--ink-soft); }
.paper-tile-grabbed { font-size: var(--fs-xs); color: var(--seal-deep); margin-left: 2px; }
.paper-row-legend { margin: var(--sp-1) 0 0; font-size: var(--fs-xs); color: var(--ink-faint); line-height: 1.6; }

/* ───────────────── 1.1：实验室空间（房间 → 台位 → 实验台网格 → 仪器） ───────────────── */
.card-lab { border-top: 3px solid var(--jade); }
.rooms { display: grid; gap: var(--sp-5); }
.room { border: 1px solid var(--line-strong); border-radius: var(--r-3); background: var(--paper-sunken);
  background-image: repeating-linear-gradient(0deg, rgba(120,100,60,0.05) 0 1px, transparent 1px 22px), repeating-linear-gradient(90deg, rgba(120,100,60,0.05) 0 1px, transparent 1px 22px);
  padding: var(--sp-4); display: grid; gap: var(--sp-4); }
.room-head { display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap; }
.room-seal { font-family: var(--font-num); font-weight: 700; font-size: var(--fs-sm); letter-spacing: 0.06em; color: var(--seal); border: 2px solid var(--seal); border-radius: var(--r-1); padding: 1px var(--sp-2); background: var(--paper-card); transform: rotate(-2deg); }
.room-seal.is-locked { color: var(--ink-faint); border-color: var(--line-strong); border-style: dashed; transform: none; }
.room-title-wrap { display: grid; flex: 1 1 220px; min-width: 0; }
.room-name { font-family: var(--font-title); font-size: var(--fs-lg); letter-spacing: 0.06em; }
.room-flavor { font-size: var(--fs-xs); color: var(--ink-faint); }
.room-count { font-family: var(--font-num); font-size: var(--fs-xs); color: var(--ink-soft); }
.room-floor { display: grid; gap: var(--sp-4); }
.room-locked { background: transparent; background-image: none; border-style: dashed; }
.room-later, .room-maxed { font-size: var(--fs-xs); color: var(--ink-faint); }

.bench { display: grid; gap: var(--sp-2); align-content: start; padding: var(--sp-3); background: var(--paper-card); border: 1px solid var(--line-strong); border-radius: var(--r-2); box-shadow: var(--sh-1); min-width: 0; }
.bench-head { display: flex; align-items: baseline; gap: var(--sp-3); flex-wrap: wrap; }
.bench-name { font-size: var(--fs-sm); letter-spacing: 0.06em; }
.bench-size { font-family: var(--font-num); font-size: var(--fs-xs); color: var(--ink-faint); flex: 1 1 auto; }
.bench-grid { display: grid; gap: 3px; padding: 4px; width: max-content; max-width: 100%; background: #e9dfc8; border: 1px solid var(--line-strong); border-radius: var(--r-1); box-shadow: inset 0 1px 2px rgba(64,52,28,0.12); }
.lab-cell { appearance: none; padding: 0; margin: 0; width: var(--cell); height: var(--cell); border: 1px dashed rgba(148,139,119,0.55); border-radius: 2px; background: rgba(255,253,247,0.75); cursor: default; }
.is-holding .lab-cell { cursor: crosshair; }
.is-holding .lab-cell:hover { background: var(--paper-tint); }
.lab-cell.is-ok { background: var(--good-soft); border: 1px solid var(--good); }
.lab-cell.is-bad { background: var(--bad-soft); border: 1px solid var(--bad); }
.lab-item { appearance: none; z-index: 1; margin: 0; padding: 2px 4px; min-width: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; text-align: center;
  font-size: var(--fs-xs); line-height: 1.2; letter-spacing: 0.04em; color: var(--ink-strong); border: 1px solid var(--blue); border-radius: 3px; background: var(--blue-soft); cursor: grab; box-shadow: 0 1px 0 rgba(0,0,0,0.08); }
.lab-item.tone-major { border-color: var(--jade); background: var(--jade-soft); font-weight: 700; }
.lab-item.tone-bad { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.lab-item:hover { filter: brightness(0.97); }
.lab-item.is-selected { outline: 2px solid var(--seal); outline-offset: 1px; opacity: 0.55; }
.is-holding .lab-item { pointer-events: none; }
.bench-empty { justify-items: start; align-content: center; min-height: calc(var(--cell) * 2 + 40px); border-style: dashed; background: transparent; box-shadow: none; }
.bench-empty-k { font-size: var(--fs-xs); color: var(--ink-faint); letter-spacing: 0.1em; }
.bench-empty-actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); }

.held-bar { position: sticky; top: var(--sp-2); z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-3); padding: var(--sp-3) var(--sp-4); border: 1px solid var(--warn); border-left: 4px solid var(--warn); border-radius: var(--r-2); background: var(--warn-soft); box-shadow: var(--sh-2); }
.held-bar.is-move { border-color: var(--blue); background: var(--blue-soft); }
.held-bar[data-fit="bad"] { border-left-color: var(--bad); }
.held-bar[data-fit="ok"] { border-left-color: var(--good); }
.held-name { font-family: var(--font-title); font-size: var(--fs-lg); }
.held-size { font-family: var(--font-num); font-size: var(--fs-xs); color: var(--ink-soft); }
.held-tip { font-size: var(--fs-xs); color: var(--ink-soft); flex: 1 1 260px; }
.held-actions { display: inline-flex; gap: var(--sp-2); flex-wrap: wrap; }

.fp { display: inline-grid; gap: 1px; vertical-align: middle; }
.fp-cell { width: 8px; height: 8px; background: var(--ink-faint); border-radius: 1px; }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: var(--sp-3); }
.shop-item { display: grid; gap: var(--sp-2); align-content: start; padding: var(--sp-3) var(--sp-4); background: var(--paper-tint); border: 1px solid var(--line); border-left: 3px solid var(--blue); border-radius: var(--r-2); }
.shop-item[draggable="true"] { cursor: grab; }
.shop-item.tone-major { border-left-color: var(--jade); }
.shop-item.tone-major .fp-cell { background: var(--jade); }
.shop-item.tone-minor .fp-cell { background: var(--blue); }
.shop-item.tone-bad { border-left-color: var(--bad); }
.shop-item.is-holding { border-color: var(--seal); background: var(--seal-soft); }
.shop-item-head { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
.shop-item-name { font-family: var(--font-title); font-size: var(--fs-lg); }
.shop-item-owned { font-family: var(--font-num); font-size: var(--fs-xs); color: var(--ink-soft); margin-left: auto; }
.shop-item-stats { display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-4); }
.shop-item-flavor { font-size: var(--fs-xs); color: var(--ink-faint); font-style: italic; }
.shop-item-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }
/* 1.3 仓库：一行一台仪器（名称 + 占格 + 加成 + 取出/卖掉） */
.storage-list { display: grid; gap: var(--sp-2); }
.storage-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1) var(--sp-3); padding: var(--sp-2) var(--sp-3); background: var(--paper-tint); border: 1px solid var(--line); border-left: 3px solid var(--blue); border-radius: var(--r-2); }
.storage-row.tone-major { border-left-color: var(--jade); }
.storage-row.tone-major .fp-cell { background: var(--jade); }
.storage-row .storage-name { font-family: var(--font-title); font-size: var(--fs-lg); }
.storage-row .storage-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); margin-left: auto; }
.storage-row .storage-flavor { flex-basis: 100%; font-size: var(--fs-xs); color: var(--ink-faint); font-style: italic; }

@media (max-width: 1100px) { .room-floor { grid-template-columns: minmax(0, 1fr) !important; } }
@media (max-width: 560px) { :root { --cell: 28px; } }

<div class="hud-row hud-resources">        <span id="hud-health"></span>        <span id="hud-integrity"></span>        <span id="hud-if"></span>        <span id="hud-first"></span>        <span id="hud-tickets"></span>        <span id="hud-students"></span></div><div class="hud-row hud-controls">        <button type="button" id="btn-help" class="btn btn-ghost" data-action="help">玩法</button>

        <button type="button" id="btn-reset" class="btn btn-ghost" data-action="reset">重开一局</button>
</div></details>
    </header>

/**

 *
 * 结构：lab.rooms[i] = { id, slots: [bench|null × ROOM_SLOTS] }

 *       lab.nextUid：台子/仪器共用的流水号（仪器进仓库也沿用采购时分配的 uid）
 *       lab.equipment：派生计数（recountEquipment 重算），formulas/rules/bots 照用。

/** 仪器在给定朝向下的占格。 */
function footprint(instId, rot) {
  const def = INSTRUMENT_MAP[instId];
  if (!def) return null;
  return rot ? { w: def.h, h: def.w } : { w: def.w, h: def.h };
}

function instrumentCells(instId) {
  const def = INSTRUMENT_MAP[instId];
  return def ? def.w * def.h : 0;
}

/** 不越界 && 不与台上其他仪器重叠（ignoreUid = 正在挪动的那台自己）。 */
function fits(bench, w, h, x, y, ignoreUid) {
  const size = bench && BENCH_MAP[bench.type];
  if (!size) return false;
  if (!Number.isInteger(x) || !Number.isInteger(y) || !Number.isInteger(w) || !Number.isInteger(h)) return false;
  if (w <= 0 || h <= 0 || x < 0 || y < 0 || x + w > size.w || y + h > size.h) return false;
  for (const it of bench.items || []) {
    if (ignoreUid && it.uid === ignoreUid) continue;
    const fp = footprint(it.inst, it.rot);
    if (!fp) continue;
    if (x < it.x + fp.w && it.x < x + w && y < it.y + fp.h && it.y < y + h) return false;
  }
  return true;
}

/** 在一张台子上按 (y, x) 扫描找第一个可放位置：先试不旋转，再试旋转。 */
function findSpotOnBench(bench, instId, ignoreUid) {
  const size = bench && BENCH_MAP[bench.type];
  const def = INSTRUMENT_MAP[instId];
  if (!size || !def) return null;
  const tries = def.w === def.h ? [false] : [false, true];
  for (const rot of tries) {
    const fp = footprint(instId, rot);
    for (let y = 0; y + fp.h <= size.h; y += 1) {
      for (let x = 0; x + fp.w <= size.w; x += 1) {
        if (fits(bench, fp.w, fp.h, x, y, ignoreUid)) return { x, y, rot };
      }
    }
  }
  return null;
}

/** 所有台子（按房间、台位顺序），附带所在位置。 */
function allBenches(lab) {
  const out = [];
  (lab.rooms || []).forEach((room, roomIdx) => {
    (room.slots || []).forEach((bench, slot) => { if (bench) out.push({ bench, room, roomIdx, slot }); });
  });
  return out;
}

function findBench(lab, benchUid) {
  return allBenches(lab).find((b) => b.bench.uid === benchUid) || null;
}

function findItem(lab, itemUid) {
  for (const loc of allBenches(lab)) {
    const item = loc.bench.items.find((it) => it.uid === itemUid);
    if (item) return { ...loc, item };
  }
  return null;
}

/* ── 1.3 仓库（LAB-SPACE §11）—— 只找/数，不改结构；写入都发生在 engine 的 reducer 里 ── */

/** 仓库条目（{ uid, inst }）或 null。 */
function findStorageItem(lab, storageUid) {
  return (lab.storage || []).find((s) => s.uid === storageUid) || null;
}

/** 仓库里按种类的仪器台数（与 countEquipment 同口径，但数的是仓库）。 */
function countStorage(lab) {
  const counts = Object.fromEntries(INSTRUMENTS.map((it) => [it.id, 0]));
  for (const s of lab.storage || []) if (counts[s.inst] !== undefined) counts[s.inst] += 1;
  return counts;
}

/** 全实验室第一个能放下该仪器的位置；没有返回 null。 */
function findSpot(lab, instId) {
  for (const loc of allBenches(lab)) {
    const spot = findSpotOnBench(loc.bench, instId);
    if (spot) return { benchUid: loc.bench.uid, ...spot };
  }
  return null;
}

/** 第一个空台位（已购房间内）。 */
function findEmptySlot(lab) {
  const rooms = lab.rooms || [];
  for (let r = 0; r < rooms.length; r += 1) {
    const slots = rooms[r].slots || [];
    for (let s = 0; s < slots.length; s += 1) if (!slots[s]) return { roomIdx: r, slot: s };
  }
  return null;
}

/**
 * 由摆放重算按种类计数（= 1.0 的 lab.equipment）。
 *
 * 1.3 设计理由（仓库不参与加成/维护的**唯一**依据）：这里只统计**摆在台面上**的仪器，
 * lab.storage 里的仪器一律不计入 —— equipmentBonus / maintenanceTotal / 项目仪器要求
 * 全部读这个派生计数，所以仓库里的仪器既不提供加成、也不收维护费。
 * 反过来做（仓库也给加成）就等于给玩家一块无限大、还免费的台面，台面系统会立刻失去意义：
 * 「空间不足→加台/开房间」这条唯一的取舍会被「先塞仓库」绕过。
 */
function countEquipment(lab) {
  const counts = Object.fromEntries(INSTRUMENTS.map((it) => [it.id, 0]));
  for (const { bench } of allBenches(lab)) {
    for (const it of bench.items || []) if (counts[it.inst] !== undefined) counts[it.inst] += 1;
  }
  return counts;
}

function recountEquipment(lab) {
  lab.equipment = countEquipment(lab);
  return lab;
}

function newRoom(index) {
  const def = ROOMS[index];
  return { id: def ? def.id : 'R' + (index + 1), slots: Array.from({ length: ROOM_SLOTS }, () => null) };
}

/** 空间汇总（UI/机器人用）。 */
function spaceSummary(lab) {
  let cells = 0;
  let used = 0;
  for (const { bench } of allBenches(lab)) {
    const size = BENCH_MAP[bench.type];
    cells += size.w * size.h;
    for (const it of bench.items) used += instrumentCells(it.inst);
  }
  const slotsTotal = (lab.rooms || []).length * ROOM_SLOTS;
  const benches = allBenches(lab).length;
  return { rooms: (lab.rooms || []).length, roomMax: ROOM_MAX, slotsTotal, slotsFree: slotsTotal - benches, benches, cells, used, free: cells - used };
}

/**
 * First-Fit Decreasing 自动摆放（LAB-SPACE §9）：把计数展开成仪器列表，按格数降序
 * （同格数按 INSTRUMENTS 顺序）逐台找位；放不下就在下一个空台位**免费**建台，
 * 台位满就**免费**开下一间（最多 ROOM_MAX 间）。用于新开局与 v2→v3 迁移。
 * @param {Record<string, number>} counts
 * @param {{startBenches?: string[]}} [opts]
 * @returns {{rooms:any[], nextUid:number} | null} 放不下（超过 4 间）返回 null
 */
function layoutFromCounts(counts, opts = {}) {
  const lab = { rooms: [newRoom(0)], nextUid: 1 };
  const addBench = (type) => {
    let spot = findEmptySlot(lab);
    if (!spot) {
      if (lab.rooms.length >= ROOM_MAX) return null;
      lab.rooms.push(newRoom(lab.rooms.length));
      spot = findEmptySlot(lab);
    }
    const bench = { uid: 'b' + lab.nextUid, type, items: [] };
    lab.nextUid += 1;
    lab.rooms[spot.roomIdx].slots[spot.slot] = bench;
    return bench;
  };
  for (const type of opts.startBenches || []) if (BENCH_MAP[type]) addBench(type);
  const order = INSTRUMENTS.map((d, i) => ({ id: d.id, i, cells: d.w * d.h }))
    .sort((a, b) => (b.cells - a.cells) || (a.i - b.i));
  const queue = [];
  for (const o of order) {
    const n = Math.max(0, Math.floor(Number(counts && counts[o.id]) || 0));
    for (let k = 0; k < n; k += 1) queue.push(o.id);
  }
  let demand = queue.reduce((sum, id) => sum + instrumentCells(id), 0);
  for (const instId of queue) {
    let placed = findSpot(lab, instId);
    if (!placed) {
      const cells = instrumentCells(instId);
      const type = cells >= BIG_BENCH_ITEM_CELLS || demand >= BIG_BENCH_DEMAND_CELLS ? 'bench_big' : 'bench_std';
      const bench = addBench(type);
      if (!bench) return null;
      const spot = findSpotOnBench(bench, instId);
      if (!spot) return null;
      placed = { benchUid: bench.uid, ...spot };
    }
    const loc = findBench(lab, placed.benchUid);
    loc.bench.items.push({ uid: 'i' + lab.nextUid, inst: instId, x: placed.x, y: placed.y, rot: placed.rot });
    lab.nextUid += 1;
    demand -= instrumentCells(instId);
  }
  return lab;
}

/** 新开局布局：A301 + START_BENCHES，摆入 initCount。 */
function startingLayout() {
  return layoutFromCounts(Object.fromEntries(INSTRUMENTS.map((it) => [it.id, it.initCount])), { startBenches: START_BENCHES });
}

/**
 * 存档里的 rooms 逐项校验：未知台型/仪器、越界、重叠的一律丢弃。返回 null 表示结构不可用。
 */
function sanitizeRooms(rawRooms) {
  if (!Array.isArray(rawRooms) || rawRooms.length === 0) return null;
  const rooms = [];
  let maxUid = 0;
  const seen = new Set();
  const uidNum = (uid) => { const n = Number(String(uid).slice(1)); return Number.isFinite(n) ? n : 0; };
  rawRooms.slice(0, ROOM_MAX).forEach((raw, idx) => {
    const room = newRoom(idx);
    const slots = raw && Array.isArray(raw.slots) ? raw.slots : [];
    for (let s = 0; s < ROOM_SLOTS; s += 1) {
      const b = slots[s];
      if (!b || typeof b !== 'object' || !BENCH_MAP[b.type] || typeof b.uid !== 'string' || seen.has(b.uid)) continue;
      seen.add(b.uid);
      maxUid = Math.max(maxUid, uidNum(b.uid));
      const bench = { uid: b.uid, type: b.type, items: [] };
      for (const it of Array.isArray(b.items) ? b.items : []) {
        if (!it || typeof it.uid !== 'string' || seen.has(it.uid) || !INSTRUMENT_MAP[it.inst]) continue;
        const rot = Boolean(it.rot);
        const fp = footprint(it.inst, rot);
        const x = Number(it.x);
        const y = Number(it.y);
        if (!fits(bench, fp.w, fp.h, x, y)) continue;
        seen.add(it.uid);
        maxUid = Math.max(maxUid, uidNum(it.uid));
        bench.items.push({ uid: it.uid, inst: it.inst, x, y, rot });
      }
      room.slots[s] = bench;
    }
    rooms.push(room);
  });
  return { rooms, nextUid: maxUid + 1 };
}

/**
 * rng.js —— 确定性随机数（mulberry32）
 *
 * 为什么自己写：项目要求「无构建依赖、可无头模拟、存档可复现」。
 * 所有随机都必须来自这里的实例，禁止 Math.random()（scripts/check.mjs 会检查）。
 *
 * 可序列化：rng.snapshot() → { seed }，engine 把它存进 state.rng，
 * 因此「同一个存档 + 同一串操作」永远得到同一串结果。
 */

const RNG_VERSION = 1;

/** 字符串 → 32 位种子（FNV-1a）。 */
function hashString(str) {
  let h = 0x811c9dc5;
  const s = String(str);
  for (let i = 0; i < s.length; i += 1) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}

/**
 * @typedef {{seed:number}} RngSnapshot
 */

/**
 * 创建一个确定性随机源。
 * @param {number|string|RngSnapshot} seedOrSnapshot 种子或快照
 * @returns {{
 *   next():number, int(min:number,max:number):number, float(min:number,max:number):number,
 *   chance(p:number):boolean, pick<T>(arr:T[]):T,
 *   pickWeighted<T>(arr:T[], weightOf:(item:T)=>number):T|null,
 *   shuffle<T>(arr:T[]):T[], normal(mean:number,sd:number):number,
 *   fork(label:string):any, clone():any, snapshot():RngSnapshot
 * }}
 */
function createRng(seedOrSnapshot) {
  let s = normalizeSeed(seedOrSnapshot);

  function next() {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  const api = {
    next,
    /** 闭区间整数 [min, max]。 */
    int(min, max) {
      const lo = Math.ceil(Math.min(min, max));
      const hi = Math.floor(Math.max(min, max));
      if (hi <= lo) return lo;
      return lo + Math.floor(next() * (hi - lo + 1));
    },
    float(min, max) {
      return min + next() * (max - min);
    },
    chance(p) {
      return next() < p;
    },
    pick(arr) {
      if (!Array.isArray(arr) || arr.length === 0) return null;
      return arr[Math.floor(next() * arr.length)];
    },
    pickWeighted(arr, weightOf) {
      if (!Array.isArray(arr) || arr.length === 0) return null;
      let total = 0;
      for (const item of arr) total += Math.max(0, Number(weightOf(item)) || 0);
      if (total <= 0) return arr[0];
      let r = next() * total;
      for (const item of arr) {
        r -= Math.max(0, Number(weightOf(item)) || 0);
        if (r <= 0) return item;
      }
      return arr[arr.length - 1];
    },
    /** Fisher–Yates，返回新数组。 */
    shuffle(arr) {
      const copy = Array.isArray(arr) ? arr.slice() : [];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(next() * (i + 1));
        const tmp = copy[i];
        copy[i] = copy[j];
        copy[j] = tmp;
      }
      return copy;
    },
    /** Box–Muller 正态分布。 */
    normal(mean, sd) {
      let u = 0;
      let v = 0;
      while (u === 0) u = next();
      while (v === 0) v = next();
      const z = Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
      return mean + z * sd;
    },
    /** 派生一个独立的子随机源（用于命名、事件等互不干扰的用途）。 */
    fork(label) {
      return createRng((s ^ hashString(String(label))) >>> 0);
    },
    clone() {
      const c = createRng(s);
      return c;
    },
    snapshot() {
      return { seed: s >>> 0 };
    },
  };

  return api;
}

/** 从存档里的 state.rng 恢复随机源。 */
function rngFromSnapshot(snapshot) {
  return createRng(snapshot);
}

function normalizeSeed(input) {
  if (input && typeof input === 'object' && Number.isFinite(input.seed)) return input.seed >>> 0;
  if (typeof input === 'number' && Number.isFinite(input)) return input >>> 0;
  const h = hashString(input === undefined || input === null ? 'mxc' : input);
  return (h || 0x9e3779b9) >>> 0;
}

/** 兜底：把任意值夹到 [lo, hi]。 */
function clamp(value, lo, hi) {
  const v = Number.isFinite(value) ? value : lo;
  return Math.max(lo, Math.min(hi, v));
}

/** 保留 n 位小数（避免浮点脏值写进存档）。 */
function round(value, digits = 2) {
  const f = Math.pow(10, digits);
  return Math.round((Number(value) || 0) * f) / f;
}

/**
 * naming.js —— 学生随机命名（数据来自 src/data/names.js）
 *
 * SPEC 硬性：名字必须自然、不能千篇一律；不得出现谐音/不雅名。
 * 策略：70% 双字名 + 30% 单字名；3% 复姓；性别 是 男/女 但名字用中性库混搭；
 *      生成后查黑名单与同音黑名单，最多重试 NAME_RETRY_MAX 次。
 */



const BLOCK_SET = new Set(NAME_BLOCKLIST);
const HOMOPHONE_SET = new Set(HOMOPHONE_BLOCK);

/**
 * 生成一个学生名字。
 * @param {any} rng createRng 实例
 * @param {{used?:Set<string>|string[], gender?:'male'|'female'|'any'}} [opts]
 * @returns {{name:string, gender:'male'|'female'}}
 */
function generateName(rng, opts = {}) {
  const used = opts.used instanceof Set ? opts.used : new Set(opts.used || []);
  const forcedGender = opts.gender && opts.gender !== 'any' ? opts.gender : null;

  for (let attempt = 0; attempt < NAME_RETRY_MAX; attempt += 1) {
    const gender = forcedGender || (rng.chance(GENDER_MALE_RATE) ? 'male' : 'female');
    const surname = pickSurname(rng);
    const isDouble = rng.chance(NAME_DOUBLE_RATE);
    let given;
    if (isDouble) {
      const first = pickGiven(rng, GIVEN_FIRST, gender);
      const last = pickGiven(rng, GIVEN_LAST, gender);
      given = (first === last ? first : first + last);
    } else {
      given = pickGiven(rng, GIVEN_SINGLE, gender);
    }
    const name = surname + given;
    if (isClean(name) && !used.has(name)) {
      return { name, gender };
    }
  }
  // 兜底：字库太小/黑名单太密时的保底路径（仍然是自然名，只是不保证唯一）
  // v1.4.0：兜底也必须过黑名单/同音表——否则稀有人才（已进 NAME_BLOCKLIST）可能在极端路径下
  // 被随机拼出来，「防同名」的口径就漏了一个口子。
  let fallback = pickSurname(rng) + pickGiven(rng, GIVEN_SINGLE, forcedGender || 'any');
  for (let attempt = 0; attempt < NAME_RETRY_MAX && !isClean(fallback); attempt += 1) {
    fallback = pickSurname(rng) + pickGiven(rng, GIVEN_SINGLE, forcedGender || 'any');
  }
  return { name: fallback, gender: forcedGender || 'male' };
}

/** 黑名单 + 同音黑名单检查。 */
function isClean(name) {
  if (BLOCK_SET.has(name)) return false;
  if (name.length === 2 && HOMOPHONE_SET.has(name)) return false;
  return true;
}

/** 删除同名单字，避免「王博博」这类重复名字。 */
function pickSurname(rng) {
  if (rng.chance(COMPOUND_SURNAME_RATE)) {
    return rng.pick(SURNAMES_COMPOUND) || '欧阳';
  }
  const entry = rng.pickWeighted(SURNAMES_SINGLE, (s) => s.w);
  return entry ? entry.name : '王';
}

function pickGiven(rng, pool, gender) {
  const wantNeutral = rng.chance(GENDER_NEUTRAL_RATE);
  const filtered = pool.filter((c) => {
    if (c.g === 'n') return true;
    if (gender === 'any' || wantNeutral) return false;
    return gender === 'male' ? c.g === 'm' : c.g === 'f';
  });
  const candidates = filtered.length > 0 ? filtered : pool;
  // 字频衰减：常见字出现概率更高，长尾字偶尔出现
  const entry = rng.pickWeighted(candidates, (c) => (c.g === 'n' ? 1 : 1 - NAME_CHAR_DECAY / 2));
  return entry ? entry.name : '宁';
}

/** SPEC：开局 2 硕 1 博；等级 1 名额 硕 4 / 博 1。 */
function seedStartingCrew(state) {
  const rng = createRng(state.rng.seed ^ 0x51ed270b);
  const used = new Set();
  const plan = [
    ...Array.from({ length: INITIAL_MASTER_COUNT }, () => 'master'),
    ...Array.from({ length: INITIAL_PHD_COUNT }, () => 'phd'),
  ];
  for (const degree of plan) {
    const { name, gender } = generateName(rng, { used });
    used.add(name);
    const id = 's' + state.counters.nextStudentId;
    state.counters.nextStudentId += 1;
    state.students.push(createStudent({
      id, name, gender, degree,
      source: rng.chance(INITIAL_STUDENT_TRANSLATE_RATE) ? 'translate' : 'exam',
      ability: round(clamp(
        rng.normal(INITIAL_STUDENT_ABILITY_MEAN_SD[degree].mean, INITIAL_STUDENT_ABILITY_MEAN_SD[degree].sd),
        ABILITY_MIN, ABILITY_MAX,
      ), 3),
      enteredMonthIndex: 0,
    }));
  }
}

/** 精力上限：2 + floor(health/10) + 事件加成；健康 ≤30 时腰斩（SPEC）。 */
function energyMaxFrom(state) {
  const health = Number(state.player && state.player.health) || 0;
  const bonus = Number(state.player && state.player.energyMaxDelta) || 0;
  let max = ENERGY_MAX_BASE + Math.floor(health / 10) * ENERGY_PER_HEALTH_10 + bonus;
  if (health <= ENERGY_LOW_HEALTH_THRESHOLD) max = max * ENERGY_LOW_HEALTH_MUL;
  return Math.max(1, Math.floor(max));
}

/** 时间推进一个自然月（year/month 联动）。 */
function advanceCalendar(calendar, months = 1) {
  calendar.monthIndex += months;
  const total = calendar.monthIndex;
  calendar.year = Math.floor(total / MONTHS_PER_YEAR) + 1;
  calendar.month = (total % MONTHS_PER_YEAR) + 1;
  return calendar;
}

/**
 * store.js —— 单一 store（state + 订阅）
 *
 * 冻结约定（docs/CONTRACT.md §3.1）：
 *   · 全应用只有一个 store 实例，由 src/main.js 创建。
 *   · UI 只能 store.getState() 读、store.actions.X()/store.dispatch() 写。
 *   · 任何 reduce 都是「旧 state → 新 state」，禁止原地改（store 会冻结旧 state 便于抓错）。
 *   · 订阅回调收到 (state, event)；event 里有 { type, action, changed }。
 */



/**
 * @param {{initialState:any, reducer:(state:any, action:any)=>any, actions?:Record<string,Function>, onChange?:(state:any,event:any)=>void}} options
 */
function createStore(options) {
  const reducer = options.reducer;
  const listeners = new Set();
  const history = [];
  let state = options.initialState;

  function getState() {
    return state;
  }

  function notify(event) {
    if (typeof options.onChange === 'function') options.onChange(state, event);
    for (const listener of Array.from(listeners)) {
      try {
        listener(state, event);
      } catch (err) {
        console.error('[store] 订阅回调出错：', err);
      }
    }
  }

  /**
   * 分发一个 action。action 必须是 { type, payload } 形状的纯对象。
   * @param {{type:string, payload?:any}} action
   */
  function dispatch(action) {
    if (!action || typeof action.type !== 'string') {
      throw new Error('store.dispatch 需要一个 { type, payload } 对象');
    }
    const prev = state;
    const next = reducer(prev, action);
    if (next === undefined) {
      throw new Error('reducer 返回了 undefined（action=' + action.type + '）');
    }
    if (next === prev) {
      notify({ type: action.type, action, changed: false });
      return state;
    }
    state = next;
    history.push({ type: action.type, at: Date.now() });
    if (history.length > 200) history.shift();
    notify({ type: action.type, action, changed: true });
    return state;
  }

  /** 直接替换整个 state（读档/开新档用）。 */
  function replaceState(nextState, meta) {
    state = nextState;
    notify({ type: 'state/replace', action: { type: 'state/replace', payload: meta || {} }, changed: true });
    return state;
  }

  /** 把 ACTIONS 里的创建器绑成可直接调用的方法。 */
  const bound = {};
  for (const [name, create] of Object.entries(options.actions || {})) {
    bound[name] = (payload) => dispatch(create(payload));
  }

  return {
    getState,
    dispatch,
    replaceState,
    subscribe(listener) {
      listeners.add(listener);
      return () => listeners.delete(listener);
    },
    getHistory: () => history.slice(),
    actions: bound,
  };
}

/** 调试/测试用：确保 state 不被 UI 原地改写。 */
function freezeState(state) {
  return Object.freeze(cloneState(state));
}

/**
 * formulas.js —— 纯计算函数（无副作用、不改 state、不产生随机）
 *
 * 约定（docs/CONTRACT.md §3.2）：
 *   · 所有函数都是「读参数 → 返回数字/对象」；需要随机时由调用方把 rng 传进来。
 *   · 不允许魔法数字：一切常量从 src/data/ 取。
 */












/* ══ 精力 ══ */
function energyMax(state) {
  const health = state.player.health;
  const bonus = state.player.energyMaxDelta || 0;
  const raw = ENERGY_MAX_BASE + Math.floor(health / 10) * ENERGY_PER_HEALTH_10 + bonus;
  const mult = health <= ENERGY_LOW_HEALTH_THRESHOLD ? ENERGY_LOW_HEALTH_MUL : 1;
  return Math.max(1, Math.floor(raw * mult));
}

/* ══ 耗材模式 ══ */
function consumeMode(state) {
  return CONSUME_MODES[state.player.consumeMode] || CONSUME_MODES.normal;
}

/* ══ 仪器 ══ */
function instrumentDef(id) {
  return INSTRUMENT_MAP[id];
}

function isDown(lab, id) {
  return (lab.equipmentDown && lab.equipmentDown[id] > 0) || false;
}

/** 单台价：1.1 起固定价（LAB-SPACE §5，INST_PRICE_GROWTH = 1）；ownedCount 仅为兼容旧调用。 */
function instrumentPrice(id, ownedCount) {
  const def = instrumentDef(id);
  if (!def) return Infinity;
  return round(def.price * Math.pow(INST_PRICE_GROWTH, Math.max(0, Number(ownedCount) || 0)), 2);
}

function bonusRawSum(lab) {
  let sum = 0;
  for (const def of INSTRUMENTS) {
    const count = Number((lab.equipment && lab.equipment[def.id]) || 0);
    if (count <= 0) continue;
    const mul = isDown(lab, def.id) ? TEMP_BROKEN_BONUS_MUL : 1;
    sum += def.bonus * count * mul;
  }
  return sum;
}

/** 全实验室仪器加成的总和（停机仪器按 TEMP_BROKEN_BONUS_MUL 折算）。
 *  1.3 起不再封顶，因此它与 equipmentBonus 恒等；保留导出只为旧调用方的接口不变。
 *  口径：只统计**摆在台面上**的仪器（lab.equipment 是摆放的派生计数），仓库里的不算。 */
function equipmentBonusSum(lab) {
  return round(bonusRawSum(lab), 4);
}

/**
 * 全实验室仪器加成（停机仪器按 TEMP_BROKEN_BONUS_MUL 折算）。
 * 1.3：取消 INST_BONUS_CAP —— 直接返回全部仪器加成之和，不再截断。
 * 口径：只统计摆在台面上的仪器；仓库里的仪器不提供加成（见 core/lab.js 的 countEquipment）。
 */
function equipmentBonus(lab) {
  return round(bonusRawSum(lab), 4);
}

/** 每月仪器维护费（停机的仪器不收费：坏了就不用校准）。 */
function maintenanceTotal(lab) {
  let sum = 0;
  for (const def of INSTRUMENTS) {
    const count = Number((lab.equipment && lab.equipment[def.id]) || 0);
    if (count <= 0 || isDown(lab, def.id)) continue;
    sum += def.maintain * count;
  }
  return round(sum, 3);
}

/** 项目要求是否满足（缺哪些仪器）。 */
function missingInstruments(lab, require) {
  const missing = [];
  for (const [id, need] of Object.entries(require || {})) {
    const have = Number((lab.equipment && lab.equipment[id]) || 0);
    if (have < need) missing.push({ id, need, have });
  }
  return missing;
}

/** 校投：等级 schoolFundYear 万/年 → 每月。 */
function schoolFundMonthly(rankIndex) {
  return round(rankOf(rankIndex).schoolFundYear / 12, 3);
}

/* ══ 学生产出 ══ */
function abilityCoef(ability) {
  return ability / ABILITY_DIVISOR;
}

function happyCoef(happiness) {
  return HAPPY_COEF_BASE + HAPPY_COEF_SLOPE * happiness;
}

/**
 * 学生对该项目的月进度（未乘耗材/仪器系数）。
 *
 * t30 产出守恒：一个学生的月产能是有限的，被分到 N 个项目时就按 N 等分——
 * 「1 个人做 3 个项目」的总产出 = 「做 1 个项目」的总产出，而不是旧实现的 ×3
 *（旧实现让「把所有人塞进所有项目」成为无脑最优解，也让「多接项目」没有代价）。
 * @param {any} student
 * @param {any} project
 * @param {{projectCount?:number}} [ctx] 该生本月在研项目数（≥1；缺省 1）
 */
function studentBaseProgress(student, project, ctx) {
  let p = BASE_PROGRESS * abilityCoef(student.ability) * happyCoef(student.happiness);
  if (project && project.playerLeading) p *= PLAYER_LEAD_MUL;
  const n = ctx && Number.isFinite(ctx.projectCount) && ctx.projectCount > 0 ? ctx.projectCount : 1;
  return p / n;
}

/**
 * 月度进度乘子（耗材 + 仪器 + 未解决难点）。
 * @param {{consumable:number, lab:any, project:any, consumeMul:number}} ctx
 */
function progressMultiplier(ctx) {
  const consumePart = ctx.consumable <= 0 ? 0 : ctx.consumeMul;
  const instPart = 1 + equipmentBonus(ctx.lab);
  const worstHd = worstOpenHardpoint(ctx.project);
  const hpPart = 1 - HARDPOINT_PROGRESS_PENALTY_PER_HD * worstHd;
  return round(Math.max(0, consumePart * instPart * hpPart), 4);
}

/** 未解决难点里「最重的那个」的难度（hd）；没有则 0。 */
function worstOpenHardpoint(project) {
  if (!project || !Array.isArray(project.hardpoints)) return 0;
  let worst = 0;
  for (const hp of project.hardpoints) {
    if (hp.status === 'open' && hp.hd > worst) worst = hp.hd;
  }
  return worst;
}

function openHardpointCount(project) {
  if (!project || !Array.isArray(project.hardpoints)) return 0;
  return project.hardpoints.filter((h) => h.status === 'open').length;
}

/** 总进度百分比（分母 = workload × (1 + 0.10 × project.tier)）。 */
function projectProgressPct(project) {
  const denom = project.workload * (1 + PROGRESS_PCT_DENOM_PER_HARDPOINT * project.tier);
  if (denom <= 0) return 100;
  return round(clamp((project.progress / denom) * 100, 0, 100), 1);
}

function isProjectComplete(project) {
  return project.progress >= project.workload;
}

/** 结题尾款（未解决难点逐个打折，逾期再打折）。 */
function projectTail(project) {
  const base = project.money * (1 - project.depositRate);
  const openHp = openHardpointCount(project);
  let tail = base * Math.pow(PER_HARDPOINT_TAIL_MUL, openHp);
  if (project.overdueMonths > 0) tail *= UNDERDUE_TAIL_MUL;
  return round(Math.max(0, tail), 3);
}

/** 学生月毕业进度。 */
function degreePerMonth(student, hasProject, ctx) {
  const happyFactor = student.happiness < DEG_HAPPY_LOW_THRESHOLD
    ? DEG_HAPPY_LOW
    : DEG_HAPPY_COEF_BASE + DEG_HAPPY_COEF_SLOPE * student.happiness;
  const projFactor = hasProject ? DEG_PROJECT_FACTOR.withProject : DEG_PROJECT_FACTOR.withoutProject;
  const consumePart = ctx && ctx.consumable <= 0 ? 0 : 1;
  return round(DEGREE_BASE * abilityCoef(student.ability) * happyFactor * projFactor * consumePart, 3);
}

/* ══ 幸福度 ══ */
/** 能力对应的「期望工资档」（天赋越高越需要高工资，SPEC 方向）。 */
function expectedWageTier(ability, shift = 0) {
  let tier = ability >= WAGE_EXPECT_THRESHOLDS.high ? 3 : (ability >= WAGE_EXPECT_THRESHOLDS.mid ? 2 : 1);
  tier = Math.max(0, Math.min(3, tier + Math.round(shift || 0)));
  return ['none', 'low', 'mid', 'high'][tier];
}

function wageCost(student) {
  const table = WAGE[student.degree] || WAGE.master;
  return Number(table[student.wageTier] || 0);
}

/**
 * 一名学生本月的幸福度变化（不含行动/事件类加成）。
 * @param {any} student
 * @param {{consumeHappy:number, hasProject:boolean, hasOpenHardpoint:boolean, assignedProjectCount?:number}} ctx
 *   assignedProjectCount = 该生本月在研项目数（由 engine 传入 loadByStudent 的同一个计数）。
 */
function happinessDelta(student, ctx) {
  const expected = expectedWageTier(student.ability, student.wageExpectShift || 0);
  const gap = WAGE_INDEX[expected] - WAGE_INDEX[student.wageTier];
  let d = WAGE_HAPPY[student.wageTier] || 0;
  // t47 修复符号：期望与实际差几档就扣几档（GAP_PENALTY 是「每差一档扣多少」的正数常量）。
  // 旧实现写成 `d += GAP_PENALTY * gap`，等于「欠薪反而更幸福」，与 SPEC「高工资增加幸福度、
  // 低工资降低幸福度、无工资大幅降低」方向相反，还制造了「克扣最好的学生」这一支配策略。
  // 坚持把符号放在**减号**上（而不是把常量改成负数、或翻转 gap 的方向）：常量名 GAP_PENALTY
  // 的语义就是惩罚，`-=` 与它自洽；若常量变成负数，后人看到「PENALTY 是负的」更容易当笔误改回去。
  d -= GAP_PENALTY * gap;
  d += ctx.consumeHappy || 0;
  d += ctx.hasProject ? (ctx.hasOpenHardpoint ? PROJECT_STRESS_HARDPOINT : 0) : PROJECT_STRESS_IDLE;
  // t42（B 方案，主理人拍板）：同一名学生带 n 个在研项目时，每月额外 −(n−1)× 惩罚。
  // n=0（无项目）不吃这条，仍走上面的 PROJECT_STRESS_IDLE；惩罚与 grudge/defer 独立叠加。
  const projectLoad = Number.isFinite(ctx.assignedProjectCount) ? ctx.assignedProjectCount : 0;
  d -= Math.max(0, projectLoad - 1) * MULTI_PROJECT_HAPPY_PENALTY;
  if (student.grudgeMonths > 0) d -= 2;
  if (student.deferMonths > 0) d -= 1;
  if (student.happiness > HAPPY_REGRESSION_THRESHOLD) {
    d -= (student.happiness - HAPPY_REGRESSION_THRESHOLD) * HAPPY_REGRESSION_SLOPE;
  }
  return round(d, 3);
}

function clampHappiness(v) {
  return Math.round(clamp(v, HAPPINESS_MIN, HAPPINESS_MAX));
}

/* ══ 人才市场 ══ */
function hireCost(ability, source) {
  const table = RECRUIT_COST[source] || RECRUIT_COST.translate;
  return round(table.base + table.perAbility * ability, 2);
}

/** 招募门槛：reqIF / reqRank（SPEC：越好的学生要求越高）。 */
function recruitRequirement(ability, source) {
  const w = REQ_IF_WEIGHT[source] || REQ_IF_WEIGHT.translate;
  const reqIF = Math.max(0, Math.round((ability - REQ_IF_BASE_ABILITY) * w));
  const reqRank = Math.min(REQ_RANK_CAP, 1 + Math.floor(reqIF / REQ_RANK_PER_IF));
  return { reqIF, reqRank };
}

/* ══ 难点 ══ */
/** 难度分布采样：返回 hd（1..3）。 */
function rollHardpointHd(tier, rng) {
  const dist = HARDPOINT_HD_DIST[Math.max(1, Math.min(6, Math.floor(tier)))] || HARDPOINT_HD_DIST[1];
  const entries = dist.map(([hd, w]) => ({ hd, w }));
  const picked = rng.pickWeighted(entries, (e) => e.w);
  return picked ? picked.hd : 1;
}

function teamSuccessChance(students, retryBonus = 0) {
  const n = students.length;
  const avg = n > 0 ? students.reduce((s, st) => s + st.ability, 0) / n : 0;
  const raw = TEAM_SUCCESS_BASE + TEAM_SUCCESS_PER_STUDENT * n
    + TEAM_SUCCESS_ABILITY_COEF * (avg - TEAM_SUCCESS_ABILITY_REF) + retryBonus;
  return round(clamp(raw, TEAM_SUCCESS_CLAMP[0], TEAM_SUCCESS_CLAMP[1]), 3);
}

function soloSuccessChance(ability, retryBonus = 0) {
  const raw = SOLO_SUCCESS_ABILITY_COEF * ability + SOLO_SUCCESS_BASE + retryBonus;
  return round(clamp(raw, SOLO_SUCCESS_CLAMP[0], SOLO_SUCCESS_CLAMP[1]), 3);
}

function fakeCatchChance(fakeCountInProject, fakesTotal) {
  const raw = FAKE_CATCH_BASE + FAKE_CATCH_PER_PROJECT * fakeCountInProject + FAKE_CATCH_GLOBAL * fakesTotal;
  return round(clamp(raw, 0, FAKE_CATCH_CAP), 3);
}

function retryBonus(retries) {
  return Math.min(HARDPOINT_RETRY_CAP, HARDPOINT_RETRY_BONUS * retries);
}

/* ══ 论文 ══ */
function paperIF(tier, rng) {
  const base = JOURNAL_IF_BASE[tier] || 0;
  const roll = rng ? rng.float(IF_RANDOM_LOW, IF_RANDOM_HIGH) : 1;
  return round(base * roll, IF_ROUND_DECIMALS);
}

function paperScore(papers) {
  return round(
    (papers.top || 0) * JOURNAL_IF_BASE.top + (papers.q1 || 0) * JOURNAL_IF_BASE.q1
    + (papers.q2 || 0) * JOURNAL_IF_BASE.q2 + (papers.q3 || 0) * JOURNAL_IF_BASE.q3
    + (papers.q4 || 0) * JOURNAL_IF_BASE.q4, 1);
}

/* ══ 晋升 ══ */
/**
 * 距离下一级还差什么。
 * @returns {{rank:any, next:any|null, ok:boolean, missing:Array<{key:string,need:number,have:number,text:string}>}}
 */
function rankStatus(state) {
  const rank = rankOf(state.player.rankIndex);
  const next = state.player.rankIndex >= RANKS.length - 1 ? null : rankOf(state.player.rankIndex + 1);
  if (!next) return { rank, next: null, ok: false, missing: [] };
  const missing = [];
  const p = state.player;
  const push = (key, need, have, text) => {
    if (have < need) missing.push({ key, need, have, text });
  };
  push('totalIF', next.ifReq, round(p.totalIF, 1), '总影响因子 ' + next.ifReq);
  push('q1', next.q1Req, p.papers.q1, '一区论文 ' + next.q1Req + ' 篇');
  push('q2', next.q2Req, p.papers.q2, '二区论文 ' + next.q2Req + ' 篇');
  push('top', next.topReq, p.papers.top, '正刊论文 ' + next.topReq + ' 篇');
  // 项目要求：t30 起支持两条子句（BALANCE §18.10 的 r8 = 「T6×1 且 T5+×2」）。
  const finished = state.projects.filter((pr) => pr.status === 'finished');
  const needTier = (tier) => finished.filter((pr) => pr.tier >= tier).length;
  const clauses = [];
  if (Number(next.projTierReq) > 0) clauses.push({ tier: next.projTierReq, count: next.projCountReq || 1 });
  if (Number(next.projTierReq2) > 0) clauses.push({ tier: next.projTierReq2, count: next.projCountReq2 || 1 });
  for (const clause of clauses) {
    if (needTier(clause.tier) < clause.count) {
      missing.push({
        key: 't' + clause.tier,
        need: clause.count,
        have: needTier(clause.tier),
        text: clause.tier >= 6 ? ('T6 结题 ' + clause.count + ' 项') : ('T' + clause.tier + ' 及以上结题 ' + clause.count + ' 项'),
      });
    }
  }
  return { rank, next, ok: missing.length === 0, missing };
}

/** 当前是否处于增选窗口（每 24 个月一次，研究：院士每两年增选一次）。 */
function isElectionWindow(state, interval = 24) {
  return state.calendar.monthIndex > 0 && state.calendar.monthIndex % interval === 0;
}

/**
 * 院士推荐票门槛（BALANCE §18.6）：基准 3 张，每错过一个增选窗口 +2 张，上限 9 张。
 * 「错过」= 已经到 rank7 且除票数外的门槛都满足，却在窗口开出时票不够（见 engine.checkElectionWindow）。
 */
function ticketRequirement(state) {
  const missed = Math.max(0, Math.floor(Number(state.player.missedElectionWindows) || 0));
  return Math.min(RECOMMEND_TICKET_REQ + TICKET_REQ_PER_MISSED_WINDOW * missed, TICKET_REQ_MAX);
}

/** 距最近一次拿到「本人署名一作」的月数（本局还没拿到就从第 0 月起算）。 */
function monthsSinceOwnFirstAuthor(state) {
  const last = Number(state.player.lastFirstAuthorMonthIndex);
  const now = state.calendar.monthIndex;
  if (!Number.isFinite(last) || last < 0) return Math.max(0, now);
  return Math.max(0, now - last);
}

/** 是否处于「一作空窗」（core 判定，UI 只渲染；阈值见 data/tuning.js 的 FIRST_AUTHOR_DROUGHT_MONTHS）。 */
function firstAuthorDrought(state) {
  const months = monthsSinceOwnFirstAuthor(state);
  return {
    months,
    threshold: FIRST_AUTHOR_DROUGHT_MONTHS,
    stuck: state.player.rankIndex <= 1 && months >= FIRST_AUTHOR_DROUGHT_MONTHS,
  };
}

/* ══ 工具 ══ */
function totalStudentsGraduated(state) {
  return (state.player.graduated.master || 0) + (state.player.graduated.phd || 0);
}

function activeStudents(state) {
  return state.students.filter((s) => !s.left && !s.graduated);
}

function activeProjects(state) {
  return state.projects.filter((p) => p.status === 'active');
}

function projectDefOf(project) {
  return PROJECT_MAP[project.defId] || null;
}

/* ── src/core/rules.js ── */
/**
 * rules.js —— 纯判定函数（条件 DSL、承接门槛、市场开放、事件可选性、结局判定）
 *
 * 条件 DSL（docs/CONTRACT.md §4）必须可序列化，因此全部用对象描述，不含函数：
 *   true                                  —— 恒真
 *   { stat:'totalIF', op:'>=', value:300 } —— 玩家数值比较（op: > >= < <= == !=）
 *   { flag:'metThisMonth' }                —— state.flags / state.month.flags 为真
 *   { hasInstrument:'hplc', min:1 }        —— 持有仪器数量
 *   { anyProject:{ active:true, category:'enterprise', tierAtLeast:3 } }
 *   { anyStudent:{ happinessBelow:40, happinessAtLeast:50, abilityAtLeast:0.85, source:'exam' } }
 *   { all:[...] } / { any:[...] } / { not:{...} }
 *   { ctxStudent:{ happinessBelow:30 } }   —— 事件效果里的 if 用：本次事件选中的学生
 */








/* ══ 条件 DSL ══ */
const STAT_GETTERS = {
  totalIF: (s) => s.player.totalIF,
  integrity: (s) => s.player.integrity,
  health: (s) => s.player.health,
  money: (s) => s.player.money,
  consumable: (s) => s.player.consumable,
  energy: (s) => s.player.energy,
  rankIndex: (s) => s.player.rankIndex,
  ageYears: (s) => s.player.age,
  tickets: (s) => s.player.tickets,
  studentsGraduated: (s) => totalStudentsGraduated(s),
  studentCount: (s) => activeStudents(s).length,
  projectCount: (s) => activeProjects(s).length,
  fakesTotal: (s) => s.counters.fakesTotal,
  grabbedPapers: (s) => s.counters.grabbedPapers,
  boughtPapers: (s) => s.counters.boughtPapers,
  recentQ4Papers: (s) => s.player.papers.q4,
  monthIndex: (s) => s.calendar.monthIndex,
  year: (s) => s.calendar.year,
  month: (s) => s.calendar.month,
};

function compare(a, op, b) {
  switch (op) {
    case '>': return a > b;
    case '>=': return a >= b;
    case '<': return a < b;
    case '<=': return a <= b;
    case '==': return a === b;
    case '!=': return a !== b;
    default: return false;
  }
}

function matchProject(p, spec) {
  if (!spec) return true;
  if (spec.active !== undefined && (p.status === 'active') !== spec.active) return false;
  if (spec.category && p.category !== spec.category) return false;
  if (spec.tierAtLeast !== undefined && p.tier < spec.tierAtLeast) return false;
  if (spec.openHardpoint !== undefined && (p.hardpoints || []).some((h) => h.status === 'open') !== spec.openHardpoint) return false;
  return true;
}

function matchStudent(st, spec) {
  if (!spec) return true;
  const active = !st.left && !st.graduated;
  if (spec.active !== undefined && active !== spec.active) return false;
  if (spec.source && st.source !== spec.source) return false;
  if (spec.degree && st.degree !== spec.degree) return false;
  if (spec.happinessBelow !== undefined && !(st.happiness < spec.happinessBelow)) return false;
  if (spec.happinessAtLeast !== undefined && !(st.happiness >= spec.happinessAtLeast)) return false;
  if (spec.abilityAtLeast !== undefined && !(st.ability >= spec.abilityAtLeast)) return false;
  if (spec.grudge !== undefined && (st.grudgeMonths > 0) !== spec.grudge) return false;
  return true;
}

/**
 * 求值条件。
 * @param {any} cond
 * @param {{state:any, student?:any, project?:any}} ctx
 */
function evaluateCondition(cond, ctx) {
  if (cond === undefined || cond === null || cond === true) return true;
  if (cond === false) return false;
  const state = ctx.state;

  if (Array.isArray(cond)) return cond.every((c) => evaluateCondition(c, ctx));
  if (cond.all) return cond.all.every((c) => evaluateCondition(c, ctx));
  if (cond.any) return cond.any.some((c) => evaluateCondition(c, ctx));
  if (cond.not) return !evaluateCondition(cond.not, ctx);

  if (cond.stat) {
    const getter = STAT_GETTERS[cond.stat];
    if (!getter) return false;
    return compare(getter(state), cond.op || '>=', cond.value);
  }
  if (cond.flag) {
    return Boolean(state.flags[cond.flag] || (state.month && state.month.flags && state.month.flags[cond.flag]));
  }
  if (cond.hasInstrument) {
    const have = Number((state.lab.equipment && state.lab.equipment[cond.hasInstrument]) || 0);
    return have >= (cond.min === undefined ? 1 : cond.min);
  }
  if (cond.anyProject) return state.projects.some((p) => matchProject(p, cond.anyProject));
  if (cond.anyStudent) return state.students.some((st) => matchStudent(st, cond.anyStudent));
  if (cond.ctxStudent) return ctx.student ? matchStudent(ctx.student, cond.ctxStudent) : false;
  if (cond.ctxProject) return ctx.project ? matchProject(ctx.project, cond.ctxProject) : false;
  return false;
}

/* ══ 市场 ══ */
/**
 * 人才市场（招生季）今天开不开。t22（T11-F1）：这里只描述**招生季**，
 * 不再有「第 0 月强行算开放」的特例 —— 那个特例会让第 0 月出现
 * 「open 为真但市场里一个候选人都没有」的自相矛盾状态（MARKET_OPEN_FIRST_MONTH 已删除）。
 * 项目市场不归它管：项目 offer 全年按 PROJECT_SLOTS / REFRESH_MONTHLY 刷新。
 */
function isMarketOpen(state) {
  return MARKET_OPEN_MONTHS.includes(state.calendar.month);
}

/**
 * 「这个 offer 在头衔与仪器上够得着吗」——不看当前在研项目数。
 * 市场刷新用它保证「池子里永远有可接的项目」；并发上限是玩家侧的临时状态，
 * 不能拿来做市场不变式（在研满了的时候任何 offer 都会被判不可接）。
 */
function offerReachable(state, offer) {
  if (!offer || offer.kind !== 'project') return false;
  if (missingInstruments(state.lab, offer.require || {}).length > 0) return false;
  return offer.tier <= rankOf(state.player.rankIndex).maxProjectTier;
}

/** 承接一个市场项目是否可行（头衔 + 仪器 + 并发名额）。 */
function canAcceptOffer(state, offer) {
  const reasons = [];
  const missing = missingInstruments(state.lab, offer.require || {});
  if (missing.length > 0) {
    reasons.push({ code: 'instruments', text: '仪器不足：' + missing.map((m) => m.id + '(' + m.have + '/' + m.need + ')').join('、') });
  }
  const rank = rankOf(state.player.rankIndex);
  if (offer.tier > rank.maxProjectTier) {
    reasons.push({ code: 'rank', text: '当前头衔最高只能承接 T' + rank.maxProjectTier + ' 项目' });
  }
  const cap = rank.concurrentCap;
  if (activeProjects(state).length >= cap) {
    reasons.push({ code: 'concurrent', text: '在研项目已达上限 ' + cap + ' 项' });
  }
  return { ok: reasons.length === 0, reasons };
}

/**
 * 「这个候选人我够得着吗」——只看头衔与组内 IF 门槛，不看名额/经费/本月上限。
 * 市场刷新用它保证「招生季里总有至少一个真能招的候选人」：名额/经费不足是玩家侧状态，
 * 不能拿来做市场不变式。
 */
function recruitReachable(state, offer) {
  if (!offer || offer.kind !== 'student') return false;
  // t30（BALANCE §18.13）：头衔不再参与准入——否则「IF 上万但一作不足卡在 rank1」的存档
  // 会连一个候选人都招不到（t13 实测 0 人），实验室就此断供。reqRank 保留为展示用 titleReq。
  return state.player.totalIF >= (offer.reqIF || 0);
}

/** 招募一个候选人是否可行（头衔 + IF + 名额 + 经费 + 本月上限）。 */
function canRecruitOffer(state, offer) {
  const reasons = [];
  const rank = rankOf(state.player.rankIndex);
  const cap = offer.degree === 'phd' ? rank.phdCap : rank.masterCap;
  // SPEC：延毕生不占招生名额 → 只统计未延毕的在读生
  const counted = state.students.filter((s) => !s.left && !s.graduated && s.degree === offer.degree && s.deferMonths <= 0).length;
  if (counted >= cap) reasons.push({ code: 'quota', text: '名额已满（' + counted + '/' + cap + '）' });
  if (state.player.money < offer.cost) reasons.push({ code: 'money', text: '经费不足，需要 ' + offer.cost + ' 万' });
  if (state.player.totalIF < offer.reqIF) reasons.push({ code: 'if', text: '组内 IF 门槛 ' + offer.reqIF + '（当前 ' + Math.round(state.player.totalIF) + '）' });
  if (state.market.recruitedThisMonth >= RECRUIT_PER_MONTH) reasons.push({ code: 'monthly', text: '本月招募名额已用完' });
  return { ok: reasons.length === 0, reasons };
}

function poolCap() {
  return POOL_CAP;
}

/* ══ 事件 ══ */
function eventCooldownLeft(state, eventId) {
  const last = state.eventState.lastFiredMonth[eventId];
  if (last === undefined) return 0;
  const cd = EVENT_COOLDOWN_MONTHS;
  return Math.max(0, cd - (state.calendar.monthIndex - last));
}

function availableEvents(state) {
  return EVENTS.filter((ev) => {
    if (ev.once && state.eventState.lastFiredMonth[ev.id] !== undefined) return false;
    if (eventCooldownLeft(state, ev.id) > 0) return false;
    return evaluateCondition(ev.cond, { state });
  });
}

/* ══ 晋升 / 增选 ══ */
function promotionStatus(state) {
  const status = rankStatus(state);
  if (!status.next) return { ...status, eligible: false, reason: '已是最高头衔' };
  let eligible = status.ok;
  let reason = '';
  if (status.next.index === 8) {
    if (state.player.age < MIN_ACADEMICIAN_AGE) { eligible = false; reason = '年龄不足 ' + MIN_ACADEMICIAN_AGE + ' 岁'; }
    else if (state.player.tickets < ticketRequirement(state)) { const need = ticketRequirement(state); eligible = false; reason = '推荐票不足（' + state.player.tickets + '/' + need + (state.player.missedElectionWindows ? '，已错过 ' + state.player.missedElectionWindows + ' 次窗口，门槛随之上调' : '') + '）'; }
    else if (!state.flags.electionWindowOpen) { eligible = false; reason = '不在增选窗口（每 ' + ELECTION_WINDOW_INTERVAL + ' 个月一次）'; }
  }
  return { ...status, eligible, reason };
}

/* ══ 结局 ══ */
function endingFor(state) {
  for (const ending of ENDINGS) {
    if (evaluateCondition(ending.cond, { state })) {
      const variant = (ending.variants || []).find((v) => evaluateCondition(v.cond, { state }));
      return { ending, variant: variant || null };
    }
  }
  return null;
}

/** 破产判定（连续 N 个月 money<0 且耗材见底，SPEC 方向）。 */
function isBankrupt(state) {
  return (state.flags.negativeMoneyMonths || 0) >= BANKRUPT_NEGATIVE_MONTHS;
}

function isLabEmpty(state) {
  return (state.month.leavesThisMonth || 0) >= LAB_EMPTY_THRESHOLD;
}

/* ── src/core/engine.js ── */
/**
 * engine.js —— 游戏核心：action 定义 + reducer（state 的合法变迁）
 *
 * 架构约定（docs/CONTRACT.md §3.1 / ARCHITECTURE.md §5）：
 *   · reducer 是纯函数：reduce(state, action) → 新 state，绝不原地修改入参。
 *   · 所有随机都来自 state.rng（用 createRng(state.rng) 取），结束时把快照写回。
 *   · 所有数值从 src/data/ 取；本文件里的数字只能是索引/循环/单位换算。
 *   · 一次 reduce 只处理一个 action；月份推进的全部顺序写在 monthTick() 里（可读性优先）。
 */




















/* ════════════════════════════ action 定义 ════════════════════════════ */

/**
 * 所有 UI 能发起的操作都在这里冻结成 action。
 * 命名规范：域/动词（game/advanceMonth）。
 */
const ACTIONS = {
  newGame: (payload = {}) => ({ type: 'game/newGame', payload }),
  advanceMonth: (payload = {}) => ({ type: 'game/advanceMonth', payload }),
  doAction: (payload) => ({ type: 'game/doAction', payload }),
  setConsumeMode: (payload) => ({ type: 'game/setConsumeMode', payload }),
  buyConsumable: (payload = {}) => ({ type: 'game/buyConsumable', payload }),
  setWage: (payload) => ({ type: 'game/setWage', payload }),
  hireStudent: (payload) => ({ type: 'game/hireStudent', payload }),
  buyEquipment: (payload) => ({ type: 'game/buyEquipment', payload }),   // 1.1：= lab/buyInstrument（无坐标→自动找位）
  buyRoom: (payload = {}) => ({ type: 'lab/buyRoom', payload }),
  buyBench: (payload) => ({ type: 'lab/buyBench', payload }),
  sellBench: (payload) => ({ type: 'lab/sellBench', payload }),
  buyInstrument: (payload) => ({ type: 'lab/buyInstrument', payload }),
  moveItem: (payload) => ({ type: 'lab/moveItem', payload }),
  sellItem: (payload) => ({ type: 'lab/sellItem', payload }),
  // 1.3 仓库：台面 → 仓库 / 仓库 → 台面 / 仓库直接卖
  storeItem: (payload) => ({ type: 'lab/storeItem', payload }),
  deployItem: (payload) => ({ type: 'lab/deployItem', payload }),

const ACTION_TYPES = Object.keys(ACTIONS);

/**
 * 「与学生交流课题」每名学生每月的次数上限（= GDD §8 的「每名学生 2 次」）。
 * t16 F4：数值已移进 src/data/actions.js，这里原样再导出，保持既有 import 路径可用。
 */


/* ════════════════════════════ reducer ════════════════════════════ */

/**
 * @param {any} state
 * @param {{type:string, payload?:any}} action
 * @returns {any} 新 state
 */
function reduce(state, action) {
  switch (action.type) {
    case 'game/newGame': {
      const next = createState(action.payload || {});
      pushChronicle(next, { kind: 'system', tone: 'system', text: '新的一局：' + next.player.name + ' 的目标是把 ' + next.player.sonName + ' 送上院士。' });
      // t22（T11-F1）：开局就把项目市场填上。项目市场是全年刷新的，跟招生季无关，
      // 不填的话第 0 月会出现「selectMarket().open 为真、但项目 offer 数是 0」的自相矛盾状态。
      const rng0 = createRng(next.rng);
      refreshMarket(next, rng0, (kind, text, tone) => pushChronicle(next, { kind, text, tone: tone || 'system' }));
      next.rng = rng0.snapshot();
      return next;
    }
    case 'game/advanceMonth': return reduceAdvanceMonth(state, action.payload || {});
    case 'game/doAction': return reduceDoAction(state, action.payload || {});
    case 'game/setConsumeMode': return reduceSetConsumeMode(state, action.payload || {});
    case 'game/buyConsumable': return reduceBuyConsumable(state, action.payload || {});
    case 'game/setWage': return reduceSetWage(state, action.payload || {});
    case 'game/hireStudent': return reduceHireStudent(state, action.payload || {});
    case 'game/buyEquipment':
    case 'lab/buyInstrument': return reduceBuyInstrument(state, action.payload || {});
    case 'lab/buyRoom': return reduceBuyRoom(state);
    case 'lab/buyBench': return reduceBuyBench(state, action.payload || {});
    case 'lab/sellBench': return reduceSellBench(state, action.payload || {});
    case 'lab/moveItem': return reduceMoveItem(state, action.payload || {});
    case 'lab/sellItem': return reduceSellItem(state, action.payload || {});
    case 'lab/storeItem': return reduceStoreItem(state, action.payload || {});
    case 'lab/deployItem': return reduceDeployItem(state, action.payload || {});
    case 'lab/sellStored': return reduceSellStored(state, action.payload || {});
    case 'game/acceptProject': return reduceAcceptProject(state, action.payload || {});
    case 'game/lockOffer': return reduceLockOffer(state, action.payload || {});
    case 'game/assignStudent': return reduceAssign(state, action.payload || {}, true);
    case 'game/unassignStudent': return reduceAssign(state, action.payload || {}, false);
    case 'game/autoAssign': return reduceAutoAssign(state);
    case 'game/togglePlayerLead': return reduceToggleLead(state, action.payload || {});
    case 'game/resolveHardpoint': return reduceResolveHardpoint(state, action.payload || {});
    case 'game/buyFirstAuthor': return reduceBuyFirstAuthor(state, action.payload || {});
    case 'game/grabFirstAuthor': return reduceGrabFirstAuthor(state, action.payload || {});
    case 'game/chooseDefer': return reduceChooseDefer(state, action.payload || {});
    case 'game/deferStudentByBoss': return reduceDeferStudentByBoss(state, action.payload || {});
    case 'game/resolveEvent': return reduceResolveEvent(state, action.payload || {});
